<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, initial-scale=1"/>
<title>7GIONNY · Debate Overlay</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   7GIONNY — DÉBAT / SONDAGE OVERLAY  (v1.0)
   DA : Noir mat #0A0A0A · Violet #7000FF / #9146FF · Blanc #FFFFFF
   Grille de référence : 1920 × 1080 · Lower-third · 100 % transparent
   ─────────────────────────────────────────────────────────────────── */
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/inter-400.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/inter-600.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/inter-700.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:800;font-display:swap;src:url('fonts/inter-800.woff2') format('woff2')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/outfit-var.woff2') format('woff2')}
@font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/bebas-400.woff2') format('woff2')}

:root{
  --noir:#0A0A0A;
  --violet:#9146FF;
  --violet-deep:#7000FF;
  --violet-rgb:145,70,255;
  --violet-light:#C79BFF;
  --blanc:#FFFFFF;
  --gris:#9AA0A6;
  --gris-fonce:#6B7280;
  --ligne:rgba(255,255,255,.08);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.55,0,.75,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

/* — Scène de référence 1920×1080, mise à l'échelle au viewport — */
#scene{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;pointer-events:none}

/* — Fond caméra simulé (APERÇU HORS OBS UNIQUEMENT · ?bg=1) — */
#bgSim{position:absolute;inset:0;background:radial-gradient(1300px 750px at 50% 36%,#17181c 0%,#0d0d0f 55%,#060607 100%)}
#bgSim::before{content:"CAMÉRA · PLEIN ÉCRAN · 1080P";position:absolute;top:54px;left:0;right:0;text-align:center;
  font-size:12px;font-weight:600;letter-spacing:.55em;color:rgba(255,255,255,.26)}
#bgSim::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:80px 80px}

/* ═══ CARTE DU DÉBAT — top center, hauteur dynamique selon nb réponses ═══
   880px large, top 96px, hauteur auto (2 réponses = compact, 4 = plus haut) */
#card{
  position:absolute;left:50%;top:96px;bottom:auto;
  width:880px;height:auto;min-height:180px;
  transform:translate(-50%,-28px);
  opacity:0;visibility:hidden;
  background:linear-gradient(180deg,rgba(18,18,21,.97) 0%,rgba(10,10,10,.96) 100%);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid var(--ligne);
  border-radius:12px;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 4px 18px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.05);
  transition:opacity .65s var(--ease-out),transform .65s var(--ease-out);
  z-index:8;
}

#card.is-live{opacity:1;transform:translate(-50%,0);visibility:visible}
#card.is-exit{opacity:0;transform:translate(-50%,-18px);
  transition:opacity .42s var(--ease-in),transform .42s var(--ease-in)}
#card.is-hidden{visibility:hidden}
#card.is-hidden.is-exit{transition:none}

.pad{position:relative;padding:18px 24px;display:flex;flex-direction:column;gap:10px}

/* — En-tête : monogramme 7G (gauche) · chip centrée · timer à droite — */
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.head .mark7g{justify-self:start;width:36px;height:36px;border-radius:8px}
.head #timer{justify-self:end}
.chip{display:inline-flex;align-items:center;gap:9px;padding:6px 14px;border-radius:4px;
  border:1px solid rgba(145,70,255,.42);font-family:'Bebas Neue',sans-serif;font-weight:400;
  font-size:14px;letter-spacing:.18em;color:#E7E9EE;
  transition:border-color .3s,color .3s}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);
  box-shadow:0 0 8px rgba(145,70,255,.9);animation:pulse 1.6s ease-in-out infinite}
.chip.is-result{border-color:var(--violet);color:#fff}
.chip.is-result .dot{animation:none;box-shadow:0 0 12px rgba(145,70,255,1)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}

#timer{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.08em;color:var(--gris);
  font-variant-numeric:tabular-nums;transition:color .3s,text-shadow .3s}
/* les deux-points pulsent : on sent le temps passer */
#timer #tColon{animation:colon 1s steps(1) infinite}
@keyframes colon{0%,54%{opacity:1}55%,100%{opacity:.18}}
#timer.is-low{color:var(--violet);text-shadow:0 0 14px rgba(145,70,255,.55)}
#timer.is-off{visibility:hidden}

/* — Question (plus lisible, 3 lignes max, 36px pour éviter la coupe) — */
#question{margin-top:10px;padding:0 0 6px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:36px;line-height:1.2;
  letter-spacing:.02em;color:var(--blanc);text-align:center;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 2px 12px rgba(0,0,0,.5);min-height:44px}

/* — Options : label · barre · pourcentage — supporte 2 à 4 choix */
.opts{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:200px 1fr 76px;align-items:center;gap:14px}
.opt[hidden]{display:none !important}
/* badge A/B/C/D : ancre de lecture */
.lbl{display:flex;align-items:center;gap:8px;min-width:0;font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;line-height:1.15;color:var(--blanc);text-align:left;transition:opacity .45s}
.ab{flex:none;width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;border:1px solid rgba(145,70,255,.55);color:var(--violet)}
.ab--b{border-color:rgba(255,255,255,.45);color:#fff}
.ab--c{border-color:rgba(124,199,255,.55);color:#7CC7FF}
.ab--d{border-color:rgba(255,209,102,.55);color:#FFD166}
.lbl__row{display:flex;align-items:center;gap:8px;min-width:0}
.lbl__t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* badge GAGNANT — apparaît sur la ligne victorieuse */
.tag{flex:none;font-family:'Outfit',sans-serif;font-size:10px;font-weight:800;letter-spacing:.18em;color:#fff;
  background:var(--violet);border:1px solid var(--violet);border-radius:4px;padding:3px 8px;
  opacity:0;transform:scale(.9);transition:opacity .3s var(--ease-out),transform .3s var(--ease-out);
  box-shadow:0 0 10px rgba(145,70,255,.5)}
.opt.is-winner .tag{opacity:1;transform:scale(1)}
#optB.is-winner .tag{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
#optC.is-winner .tag{background:#7CC7FF;color:#000;border-color:#7CC7FF}
#optD.is-winner .tag{background:#FFD166;color:#000;border-color:#FFD166}
.bar{position:relative;height:12px;border-radius:6px;overflow:hidden;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);transition:opacity .45s}
.fill{position:absolute;top:0;bottom:0;left:0;width:0%;border-radius:6px;
  transition:width .7s var(--ease-out),filter .25s var(--ease-out),box-shadow .25s var(--ease-out)}
.fill--a{background:linear-gradient(90deg,var(--violet-deep),var(--violet));
  box-shadow:0 0 10px rgba(145,70,255,.30)}
/* liseré lumineux à la tête de la barre A (détail de mouvement) */
.fill--a::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;
  background:rgba(255,255,255,.85);opacity:.55}
.fill--b{background:linear-gradient(90deg,#D9DBE0,#FFFFFF);
  box-shadow:0 0 6px rgba(255,255,255,.10)}
.fill--c{background:linear-gradient(90deg,#2A8FCE,#7CC7FF);
  box-shadow:0 0 10px rgba(124,199,255,.30)}
.fill--d{background:linear-gradient(90deg,#C99400,#FFD166);
  box-shadow:0 0 10px rgba(255,209,102,.30)}
.fill.is-flash{filter:brightness(1.45)}
/* — CONTRASTE AVANCE / RECU : à chaque vote, la barre qui gagne s'illumine,
      celle qui perd s'éteint. Le sens du match se lit d'un coup d'œil. — */
.opt.is-up .fill{filter:brightness(1.65) saturate(1.35)}
.opt.is-up .fill--a{box-shadow:0 0 22px rgba(145,70,255,.85)}
.opt.is-up .fill--b{box-shadow:0 0 22px rgba(255,255,255,.8)}
.opt.is-down .fill{filter:brightness(.5) saturate(.55)}
.pct{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.06em;color:var(--gris-fonce);
  text-align:right;font-variant-numeric:tabular-nums;
  transition:color .35s,text-shadow .35s,transform .3s var(--ease-out);opacity:1}
.pct.is-lead{color:var(--blanc)}
.opt.is-up .pct{color:var(--blanc);transform:scale(1.25)}
.opt.is-down .pct{color:var(--gris-fonce)}

/* — Pied : commande centrée · total des votes à droite (sous les %) — */
.foot{margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;letter-spacing:.12em;color:var(--gris-fonce)}
.hint{grid-column:2;justify-self:center;white-space:nowrap}
.hint b{color:var(--gris);font-weight:700}
#total{grid-column:3;justify-self:end;font-variant-numeric:tabular-nums;white-space:nowrap}

/* — Barre de décompte du temps (discret, en bas de carte) — */
.timebar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 12px 12px;
  background:rgba(255,255,255,.06);overflow:hidden}
.timebar__fill{height:100%;width:100%;
  background:linear-gradient(90deg,var(--violet-deep),var(--violet));
  transition:width .3s linear,background .3s,box-shadow .3s}
#card.is-low .timebar__fill{background:linear-gradient(90deg,var(--violet),#C79BFF);
  box-shadow:0 0 12px rgba(145,70,255,.85)}
/* 5 dernières secondes : le décompte pulse (le tic-tac s'accélère en audio) */
#card.is-critical .timebar__fill{animation:tbPulse .55s ease-in-out infinite}
@keyframes tbPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ═══ CHAT TWITCH — 460 × auto · DROITE · bottom 160 · grandit vers le haut ═══
   Fix V30 : le chat ne doit plus rétrécir quand on ajoute des sub goals.
   - .chat height auto + min-height 640, bottom 160 fixe → grandit vers le haut
   - .chat__list hauteur fixe 460px (ne bouge pas) → espace messages constant
   - .chat__goal en dessous, variable, ne pousse pas la liste */
.chat{
  position:absolute;right:48px;bottom:160px;
  width:460px;height:auto;min-height:640px;max-height:88vh;
  display:flex;flex-direction:column;
  background:rgba(10,10,12,.88);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);
  backdrop-filter:blur(12px) saturate(1.2);
  border:1px solid rgba(255,255,255,.10);border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
  opacity:1;visibility:visible;transform:none;
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out),height .35s var(--ease-out);
}
.chat.is-on{opacity:1;visibility:visible;transform:none}
.chat__head{display:flex;align-items:center;gap:9px;padding:14px 20px 12px;
  font-family:'Bebas Neue',sans-serif;font-size:22px;font-weight:400;letter-spacing:.22em;color:#E7E9EE;
  border-bottom:1px solid rgba(255,255,255,.06)}
.chat__head .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);
  box-shadow:0 0 8px rgba(145,70,255,.9);animation:pulse 1.6s ease-in-out infinite}
/* — Monogramme 7G : signature discrète, présente sur les 3 zones — */
.mark7g{display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:6px;flex:none;overflow:hidden;
  background:#000;
  box-shadow:0 0 0 1px rgba(145,70,255,.45),0 2px 10px rgba(0,0,0,.6)}
.mark7g img{width:100%;height:100%;object-fit:cover;display:block}
.chat__head .mark7g{margin-left:auto;width:36px;height:36px;border-radius:8px}
/* badges Twitch : image officielle, chip texte en repli si hors-ligne */
.cbadges{display:inline-flex;gap:3px;flex:none;align-items:center;margin-top:2px}
.cbadge{width:20px;height:20px;border-radius:4px}
.cchip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:16px;padding:0 5px;
  border-radius:4px;font-size:8px;font-weight:800;letter-spacing:.08em;
  background:rgba(145,70,255,.18);color:var(--violet);border:1px solid rgba(145,70,255,.5)}
.cchip--mod{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.45)}
.cchip--me{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.55)}
/* emotes / GIFs inline */
.cemote{height:26px;width:auto;vertical-align:-6px;margin:0 2px;border-radius:3px}
/* message MIS EN AVANT (highlight Twitch) : encart violet */
.cmsg.is-hl{background:rgba(145,70,255,.13);border:1px solid rgba(145,70,255,.45);
  border-radius:8px;padding:5px 8px;margin-left:-8px}
/* message ÉPINGLÉ : en haut du chat, style blanc, un cran plus gros */
.chat__pin{display:none;margin:10px 14px 2px;padding:8px 11px;border-radius:8px;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.09)}
.chat__pin.is-on{display:block;animation:cin .35s var(--ease-out)}
.chat__pin .cmsg{animation:none}
.chat__pin .cn{font-size:24px}
.chat__pin .ctext{font-size:22px}
.chat__pin .cflag{flex:none}
/* liste : hauteur FIXE 460px pour que le chat garde toujours le même espace
   même si on a 10 sub goals au dessus/dessous. Le conteneur .chat grandit vers le haut (bottom fixe). */
.chat__list{
  flex:none;height:460px;min-height:460px;max-height:460px;
  overflow:hidden;padding:14px 20px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:12px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 64px);
  mask-image:linear-gradient(180deg,transparent 0,#000 64px)}
/* — Typographie chat : pseudo en Outfit 800 24px (max 180), texte en Inter 700 22px lisible — */
.cmsg{display:flex;gap:10px;font-size:20px;line-height:1.45;animation:cin .35s var(--ease-out);
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','Inter',system-ui,sans-serif}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cmsg .cn{flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:'Outfit',sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em;color:var(--blanc)}
.cmsg .cn--mod{color:var(--violet)}
.cmsg .cn--me{color:var(--blanc)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.creply{font-size:14px;line-height:1.3;color:var(--gris);font-weight:600}
.creply b{color:var(--violet);font-weight:700}
.cmsg .ctext{font-family:'Inter',system-ui,sans-serif;font-size:22px;font-weight:700;color:rgba(255,255,255,.95);word-break:break-word;line-height:1.5}
/* — SUB GOAL (rallonge sous le chat, séparateur pro) — V30 : file d'attente + historique */
.chat__goal{border-top:1px solid rgba(255,255,255,.09);padding:12px 18px 15px;display:flex;flex-direction:column;gap:10px}
.goal__history{display:flex;flex-direction:column;gap:6px}
.goal__histItem{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.06);
  border-radius:6px;
  font-family:'Outfit',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.04em;
  color:rgba(255,255,255,.65);
}
.goal__histItem .goal__check{
  flex:none;width:16px;height:16px;border-radius:50%;
  background:var(--violet);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;
  box-shadow:0 0 8px rgba(var(--violet-rgb,145,70,255),.6);
}
.goal__histItem .goal__histLabel{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal__histItem .goal__histCount{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9)}
.goal__main{display:flex;flex-direction:column;gap:8px}
.goal__top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.goal__label{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--violet);
  transition:color .4s}
.goal__label--current{color:#fff;text-shadow:0 0 12px rgba(var(--violet-rgb,145,70,255),.5)}
.goal__count{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;letter-spacing:.04em;color:var(--blanc);
  font-variant-numeric:tabular-nums}
.goal__bar{height:10px;border-radius:5px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);overflow:hidden}
.goal__fill{height:100%;width:0%;border-radius:5px;
  background:linear-gradient(90deg,var(--violet-deep),var(--violet));
  box-shadow:0 0 10px rgba(var(--violet-rgb,145,70,255),.4);transition:width .8s var(--ease-out)}
.goal__main.is-done .goal__label{color:var(--blanc)}
.goal__main.is-done .goal__fill{background:linear-gradient(90deg,var(--violet),var(--violet-light,#C79BFF))}
.goal__next{opacity:.85;display:flex;flex-direction:column;gap:10px}
.goal__next[hidden]{display:none !important}
.goal__nextItem{display:flex;flex-direction:column;gap:6px}
.goal__sep{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 6px}
.goal__sep span{flex:none;width:26px;height:1px;background:rgba(255,255,255,.14);position:relative}
.goal__sep span::after{content:'—';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;color:rgba(255,255,255,.28);background:rgba(10,10,12,.88);padding:0 4px}
.goal__label--next{font-size:16px;color:rgba(255,255,255,.55)}
.goal__count--next{font-size:16px;color:rgba(255,255,255,.65)}
.goal__bar--next{height:6px;opacity:.6}
.goal__fill--next{background:rgba(255,255,255,.18);box-shadow:none}

/* ═══ ALERTES — haut centre · top 80 px · FOND UNIQUE (aucune transition d'image) ═══
   Les éléments STATIQUES (icônes, labels) sont des images générées (fond noir →
   invisible en blend « screen »). Seul le DYNAMIQUE (pseudo, nombres) reste en texte
   live pour s'adapter à la largeur.
   Séparation de couleurs : PSEUDOS = bleu clair #7CC7FF (celui qui donne ET celui qui
   reçoit, même couleur — s'accorde avec le violet du fond) · LE RESTE = blanc / gris clair.
   Icoônes/labels : PNG transparents (plus de blend, plus de rectangle noir, pas de flou). */
/* Alertes : top left par défaut pour éviter surcharge avec sondage top center
   + adaptatif : quand sondage live, reste à gauche, sinon centre */
#alerts{
  position:absolute;top:28px;left:28px;
  display:flex;flex-direction:column;align-items:flex-start;gap:14px;
  z-index:20;opacity:1;visibility:visible;
  transition:left .45s var(--ease-out),transform .45s var(--ease-out),align-items .3s;
}
#alerts.has-photo{
  /* photo : petite, à droite du milieu, avant le chat (chat = right 48 + 460) – sous le sondage pour ne pas le cacher */
  left:58%;top:360px;transform:translateX(-50%);
  align-items:center;
}
#card.is-live ~ #alerts{
  left:28px;top:28px;transform:none;align-items:flex-start;
}
#card.is-live ~ #alerts.has-photo{
  left:56%;top:360px;transform:translateX(-50%);
  align-items:center;
}
#card:not(.is-live) ~ #alerts{
  left:50%;top:80px;transform:translateX(-50%);align-items:center;
}
#card:not(.is-live) ~ #alerts.has-photo{
  left:58%;top:140px;transform:translateX(-50%);
}
/* Composition CENTRÉE : icône / label à filets / pseudo / détail —
   hiérarchie typographique : label espacé violet, pseudo bleu énorme, détail italique */
.alert{position:relative;display:flex;flex-direction:column;align-items:center;z-index:21;
  /* V38 : min-width:0 + échelle appliquée AUSSI au repos → plus de « saut de taille »
     entre l'animation et la fin de l'animation. Le rognage de la boîte a été retiré
     (c'était lui qui « mangeait » la fin des lignes) : les coins ronds restent gérés par .alert__bg. */
  gap:10px;min-width:0;width:var(--alert-w,380px);padding:24px 40px;border-radius:18px;
  transform:scale(var(--alert-scale,1));transform-origin:center;
  background:rgba(10,10,12,.9);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 28px 70px rgba(0,0,0,.55);
  --alert-scale:1;
}
/* image de fond en calque séparé : elle FADE-IN sur ~1,2 s → plus de « pop » noir
   au premier chargement (et les assets sont préchargés à l'ouverture de la page) */
.alert__bg{position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;overflow:hidden;
  background:url('assets/alert-bg.png') center/cover no-repeat;
  opacity:0;animation:bgFade 1.2s ease-out .1s forwards}
.alert--photo{
  /* V34 : petite, ne prend pas tout l'écran, à droite du milieu avant chat – 340px seulement, respecte config */
  min-width:0;
  width:var(--alert-photo-w,340px);
  max-width:var(--alert-photo-w,340px);
  aspect-ratio:4 / 5;
  /* format 4:5 respecté, mais la boîte GRANDIT si le texte a besoin de place :
     jamais une ligne avalée (l'ancien rognage de la boîte mangeait le bas du pseudo) */
  min-height:fit-content;
  padding:16px 18px 18px;
  background:#000;
  justify-content:center;
  gap:6px;
  border-radius:14px;
  box-shadow:0 14px 32px rgba(0,0,0,.55);
}
.alert--photo .alert__bg{
  background-image:url('assets/IMG_0607.jpg'), url('assets/alert-photo.jpg'), url('assets/alert-bg.png');
  background-size:contain !important;
  background-position:center center !important;
  background-repeat:no-repeat !important;
  background-color:#000;
  filter:brightness(.96) contrast(1.05);
}
.alert--photo::after{
  content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 35%,rgba(0,0,0,.35) 100%);
  pointer-events:none;
}
/* texte blanc contour noir épais pour photo – V33 : texte plus gros que image, ne rétrécit pas avec image */
.alert--photo .alert__labeltxt,
.alert--photo .alert__user{
  color:#fff;
  -webkit-text-stroke:3px #000;
  paint-order:stroke fill;
  text-shadow:
    0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000,
    1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
    0 2px 8px rgba(0,0,0,.95), 0 0 22px rgba(0,0,0,.85);
  filter:none;
}
.alert--photo .alert__labeltxt{font-size:26px;letter-spacing:.18em;line-height:1}
.alert--photo .alert__user{font-size:72px;line-height:.90;letter-spacing:.02em;max-width:100%;text-align:center;white-space:nowrap}
.alert--photo .alert__sub{color:#fff;font-weight:800;font-style:normal;font-size:16px;letter-spacing:.02em;line-height:1.25;max-width:100%;text-align:center;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 2px 10px rgba(0,0,0,.95);
}
.alert--photo .alert__icon{width:52px;height:52px}
.alert--photo .alert__body{gap:5px;max-width:100%}
.alert--photo .mark7g{width:24px;height:24px;top:8px;right:10px}
.alert--photo .alert__msg{font-size:16px;max-width:100%;color:#fff;font-style:italic;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 2px 10px rgba(0,0,0,.9)}
@keyframes bgFade{to{opacity:1}}
/* V35 animations configurables Streamlabs-like – simple descente par défaut, mais fade/slide/bounce disponibles */
.alert{ --alert-anim-dur:550ms; animation-duration:var(--alert-anim-dur); animation-timing-function:var(--ease-out); animation-fill-mode:both; animation-name:alertIn-slideTop; }
.alert.out{ animation-duration:350ms; animation-timing-function:var(--ease-in); animation-fill-mode:forwards; animation-name:alertOut-slideTop; }

@keyframes alertIn-slideTop{from{opacity:0;transform:translateY(-120px) scale(var(--alert-scale,1))}to{opacity:1;transform:translateY(0) scale(var(--alert-scale,1))}}
@keyframes alertOut-slideTop{from{opacity:1;transform:translateY(0) scale(var(--alert-scale,1))}to{opacity:0;transform:translateY(-80px) scale(var(--alert-scale,1))}}
/* compat old names */
@keyframes alertIn{from{opacity:0;transform:translateY(-120px) scale(var(--alert-scale,1))}to{opacity:1;transform:translateY(0) scale(var(--alert-scale,1))}}
@keyframes alertOut{from{opacity:1;transform:translateY(0) scale(var(--alert-scale,1))}to{opacity:0;transform:translateY(-80px) scale(var(--alert-scale,1))}}
.alert > .alert__icon,.alert > .alert__body{position:relative;z-index:1}
.alert__icon{width:100px;height:100px;object-fit:contain;max-width:100%}
/* label : Bebas violet très espacé + filet de chaque côté (le filet peut se rétracter
   pour laisser de la place au texte dans les petites alertes / formats 4:5) */
.alert__labeltxt{font-family:'Bebas Neue',sans-serif;font-size:22px;font-weight:400;
  letter-spacing:.5em;color:#B06CFF;line-height:1;
  display:flex;align-items:center;gap:16px}
.alert__labeltxt::before,.alert__labeltxt::after{content:"";width:46px;height:1px;flex:0 1 auto;min-width:6px}
.alert__labeltxt::before{background:linear-gradient(90deg,transparent,rgba(176,108,255,.75))}
.alert__labeltxt::after{background:linear-gradient(90deg,rgba(176,108,255,.75),transparent)}
.alert__body{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0;max-width:100%}
/* PSEUDO : bleu clair uni, très grand, lueur bleue.
   nowrap + ajustement auto (fitAlertLines) : le prénom reste sur UNE ligne, il rétrécit
   au lieu de se casser en deux (bug « 4 lettres puis 2 lettres »). */
.alert__user{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:.06em;line-height:1;
  color:#7CC7FF;filter:drop-shadow(0 0 16px rgba(80,170,255,.55));white-space:nowrap;max-width:100%}
/* détail : Inter italique grisé — le nom du receveur ressort en bleu gras non italique */
.alert__sub{font-size:14px;font-weight:400;font-style:italic;letter-spacing:.03em;color:#B9BEC9}
.alert__sub .hl{color:#7CC7FF;font-style:normal;font-weight:700}
/* message personnalisé du sub : ENTIER (V40 — plus de « 2 lignes puis … »), repris
   aux réglages du détail (taille + couleur) pour qu'il reste lisible */
.alert__divider{width:44px;height:1px;background:rgba(255,255,255,.18)}
.alert__msg{font-size:16px;font-weight:400;font-style:italic;color:#D8DCE3;line-height:1.5;
  max-width:min(540px,100%);text-align:center}
/* monogramme 7G : coin haut-droit, discret */
.alert .mark7g{position:absolute;top:14px;right:16px;opacity:.85;z-index:2;width:32px;height:32px;border-radius:8px}
/* Layouts Streamlabs-like */

/* FOLLOW : le plus simple */
.alert--follow{min-width:0;width:var(--alert-w,380px)}
.alert--follow .alert__user{font-size:52px}
/* SUB : le plus imposant + lueur (l'écart se VOIT) – V34 taille reglable, plus petit par défaut */
.alert--sub{min-width:0;width:var(--alert-w,380px);padding:24px 40px;border-color:rgba(145,70,255,.55);
  box-shadow:0 28px 70px rgba(0,0,0,.6),0 0 44px rgba(145,70,255,.35)}
.alert--sub::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(145,70,255,.26),transparent 70%)}
.alert--sub .alert__icon{width:120px;height:120px}
.alert--sub .alert__labeltxt{font-size:28px}
.alert--sub .alert__user{font-size:72px;filter:drop-shadow(0 0 24px rgba(80,170,255,.7))}
.alert--sub .alert__sub{color:#CFC4E8;font-size:15px}
/* RAID : blanc net */
.alert--raid{min-width:0;width:var(--alert-w,380px);border-color:rgba(255,255,255,.35)}
.alert--raid .alert__icon{width:110px;height:110px}
.alert--raid .alert__labeltxt{font-size:24px;color:#E7E9EE}
.alert--raid .alert__labeltxt::before{background:linear-gradient(90deg,transparent,rgba(231,233,238,.6))}
.alert--raid .alert__labeltxt::after{background:linear-gradient(90deg,rgba(231,233,238,.6),transparent)}
.alert--raid .alert__user{font-size:62px}

/* ═══ ALERTES V35 — layouts Streamlabs + animations in/out + media custom ═══ */
.alert__media{position:relative;z-index:1;max-width:100%;object-fit:contain;border-radius:8px}
/* formats portrait (4:5) à côté du texte : l'image ne doit pas manger la ligne du pseudo */
.alert--layout-left .alert__media,.alert--layout-right .alert__media,.alert--layout-banner .alert__media{max-width:45%}
.alert video.alert__media{background:#000}
.alert--layout-above{flex-direction:column}
.alert--layout-below{flex-direction:column-reverse}
.alert--layout-left{flex-direction:row;align-items:center;gap:18px;text-align:left}
.alert--layout-left .alert__body{align-items:flex-start;text-align:left}
.alert--layout-right{flex-direction:row-reverse;align-items:center;gap:18px;text-align:left}
.alert--layout-right .alert__body{align-items:flex-end;text-align:right}
.alert--layout-banner{flex-direction:row;align-items:center;gap:18px;width:min(720px,var(--alert-w,380px));padding:16px 22px}
.alert--layout-banner .alert__body{align-items:flex-start;text-align:left}
.alert--layout-overlay{justify-content:flex-end;min-height:220px}
.alert--layout-overlay .alert__icon,
.alert--layout-overlay .alert__media{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;border-radius:inherit;max-width:none
}
.alert--layout-overlay .alert__body{z-index:2;padding:8px 4px 4px;width:100%}
.alert.anim-in-fade{animation:alertInFade .55s var(--ease-out) both}
.alert.anim-in-slide{animation:alertIn .55s var(--ease-out) both}
.alert.anim-in-bounce{animation:alertInBounce .7s var(--ease-out) both}
.alert.anim-in-zoom{animation:alertInZoom .5s var(--ease-out) both}
.alert.anim-in-flip{animation:alertInFlip .6s var(--ease-out) both}
.alert.anim-out-fade,.alert.out.anim-out-fade{animation:alertOutFade .35s var(--ease-in) forwards}
.alert.anim-out-slide,.alert.out.anim-out-slide{animation:alertOut .35s var(--ease-in) forwards}
.alert.anim-out-bounce,.alert.out.anim-out-bounce{animation:alertOutBounce .4s var(--ease-in) forwards}
.alert.anim-out-zoom,.alert.out.anim-out-zoom{animation:alertOutZoom .32s var(--ease-in) forwards}
.alert.anim-out-flip,.alert.out.anim-out-flip{animation:alertOutFlip .4s var(--ease-in) forwards}
@keyframes alertInFade{from{opacity:0;transform:scale(var(--alert-scale,1))}to{opacity:1;transform:scale(var(--alert-scale,1))}}
@keyframes alertOutFade{from{opacity:1;transform:scale(var(--alert-scale,1))}to{opacity:0;transform:scale(var(--alert-scale,1))}}
@keyframes alertInBounce{0%{opacity:0;transform:translateY(-90px) scale(var(--alert-scale,1))}60%{opacity:1;transform:translateY(12px) scale(var(--alert-scale,1))}80%{transform:translateY(-6px) scale(var(--alert-scale,1))}100%{opacity:1;transform:translateY(0) scale(var(--alert-scale,1))}}
@keyframes alertOutBounce{from{opacity:1;transform:translateY(0) scale(var(--alert-scale,1))}to{opacity:0;transform:translateY(40px) scale(calc(var(--alert-scale,1) * .92))}}
@keyframes alertInZoom{from{opacity:0;transform:scale(calc(var(--alert-scale,1) * .42))}to{opacity:1;transform:scale(var(--alert-scale,1))}}
@keyframes alertOutZoom{from{opacity:1;transform:scale(var(--alert-scale,1))}to{opacity:0;transform:scale(calc(var(--alert-scale,1) * .4))}}
@keyframes alertInFlip{from{opacity:0;transform:perspective(800px) rotateX(75deg) scale(var(--alert-scale,1))}to{opacity:1;transform:perspective(800px) rotateX(0) scale(var(--alert-scale,1))}}
@keyframes alertOutFlip{from{opacity:1;transform:perspective(800px) rotateX(0) scale(var(--alert-scale,1))}to{opacity:0;transform:perspective(800px) rotateX(-70deg) scale(var(--alert-scale,1))}}
.alert__user.tanim-pulse{animation:alertTextPulse .9s ease-in-out infinite}
.alert__user.tanim-bounce{animation:alertTextBounce .7s ease-in-out infinite}
@keyframes alertTextPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes alertTextBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.alert.is-text-delay .alert__body{opacity:0}
.alert.is-text-on .alert__body{opacity:1;transition:opacity .35s var(--ease-out)}

/* ═══ ÉTAT RÉSULTAT (5 s de sentence) ═══ */
.opt.is-loser .lbl,.opt.is-loser .bar,.opt.is-loser .pct{opacity:.35}
.opt.is-winner{filter:brightness(1.15)}
.opt.is-winner .lbl{color:#fff;text-shadow:0 0 8px rgba(145,70,255,.6)}
.opt.is-winner .pct{color:var(--blanc);text-shadow:0 0 18px rgba(145,70,255,.8);transform:scale(1.15)}
.opt.is-winner .bar{border-color:rgba(145,70,255,.5)}
.opt.is-winner .fill--a{animation:glowA 1.5s ease-in-out infinite}
.opt.is-winner .fill--b{animation:glowB 1.5s ease-in-out infinite}
@keyframes glowA{0%,100%{box-shadow:0 0 12px rgba(145,70,255,.35)}50%{box-shadow:0 0 28px rgba(145,70,255,.85)}}
@keyframes glowB{0%,100%{box-shadow:0 0 10px rgba(255,255,255,.22)}50%{box-shadow:0 0 26px rgba(255,255,255,.7)}}

/* ═══ VÉLOCITÉ CHAT V5 — % gros + fin prévue + chrono auto +15min ═══
   - Plus long : 180x700, bottom 160 même que chat droit (centré)
   - % 52px Bebas très lisible, barre 30px, pas de croix, pas de titre FAITES GRIMPER, pas de hint
   - Structure simple : barre thermique + % + objectif (90% → +15 MIN) + fin prévue blanc ombré + chrono verrou
   - Quand fin désactivée, barre s'allonge et remplit l'espace libre
   - Logique : seuil % + durée ajout + chrono verrou (ex 2min au dessus seuil → +15 à fin prévue) */
#velocityWrap{
  --vel-w:30px; --vel-h:700px;
  position:absolute;left:28px;bottom:160px;
  width:180px;height:var(--vel-h);
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:16px 16px 14px;
  background:rgba(10,10,12,.94);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);
  backdrop-filter:blur(18px) saturate(1.35);
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  box-shadow:0 28px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset,0 1px 0 rgba(255,255,255,.08) inset;
  opacity:0;visibility:hidden;pointer-events:none;z-index:6;
  transition:opacity .5s var(--ease-out);
}
#velocityWrap.is-on{opacity:1;visibility:visible;pointer-events:none}
#velocityWrap.is-on{pointer-events:none}
.velocity__trackWrap{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;min-height:120px;
}
.velocity__track{
  position:relative;width:var(--vel-w);height:100%;
  border-radius:999px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.20);
  overflow:hidden;
  box-shadow:inset 0 1px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.07);
}
.velocity__track::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.09),transparent 18%,transparent 82%,rgba(0,0,0,.24));
  pointer-events:none;z-index:1;
}
.velocity__ticks{
  position:absolute;right:-12px;top:0;bottom:0;width:10px;pointer-events:none;z-index:4;
}
.velocity__ticks i{
  position:absolute;left:0;width:7px;height:1.5px;background:rgba(255,255,255,.20);border-radius:1px;
}
.velocity__ticks i:nth-child(1){top:5%}
.velocity__ticks i:nth-child(2){top:25%}
.velocity__ticks i:nth-child(3){top:50%}
.velocity__ticks i:nth-child(4){top:75%}
.velocity__ticks i:nth-child(5){top:95%}
.velocity__fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  border-radius:999px;
  background:linear-gradient(180deg,
    #FFFFFF 0%,
    #FFD6D6 2.5%,
    #FF3B3B 5%,
    #FF5A2E 9%,
    #FF8A2E 14%,
    #FFB547 20%,
    #6BB8FF 38%,
    #3A9AE8 66%,
    #2A8FCE 100%);
  box-shadow:0 0 20px rgba(255,90,40,.34),inset 0 1px 0 rgba(255,255,255,.78);
  will-change:height;
  transition:filter .25s var(--ease-out),box-shadow .25s;
  z-index:2;
}
.velocity__glow{
  position:absolute;left:50%;bottom:0;
  width:78px;height:78px;transform:translate(-50%,50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.98) 0%,rgba(255,80,60,.58) 22%,rgba(255,160,60,.30) 46%,transparent 72%);
  opacity:0;filter:blur(.6px);
  transition:opacity .35s var(--ease-out),bottom .12s linear;
  pointer-events:none;z-index:3;
}
.velocity__metrics{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 12px 12px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.11);
  border-radius:14px;
}
.velocity__pct{
  font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:.02em;line-height:.85;
  color:var(--blanc);text-shadow:0 2px 22px rgba(0,0,0,.95);
  font-variant-numeric:tabular-nums;
  transition:transform .25s var(--ease-out),color .25s;
}
.velocity__pct.is-pop{transform:scale(1.15)}
.velocity__goal{
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:800;letter-spacing:.08em;line-height:1.25;
  color:rgba(255,255,255,.80);text-align:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:7px 10px;width:100%;
}
.velocity__chrono{
  font-family:'Outfit',sans-serif;font-size:12px;font-weight:800;letter-spacing:.10em;line-height:1;
  color:#000;text-align:center;
  background:linear-gradient(90deg,#FF8A2E,#FFB547);
  border:1px solid rgba(255,180,71,.9);border-radius:7px;
  padding:6px 8px;width:100%;
  display:none;
  box-shadow:0 0 16px rgba(255,180,71,.45);
}
.velocity__chrono.is-on{display:block;animation:chronoPulse .9s ease-in-out infinite}
@keyframes chronoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.velocity__boost{
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:900;letter-spacing:.08em;line-height:1;
  color:#08101C;text-align:center;
  background:linear-gradient(90deg,#6BE585,#4EE3C4);
  border:1px solid rgba(122,255,190,.95);border-radius:7px;
  padding:6px 8px;width:100%;
  display:none;
  box-shadow:0 0 20px rgba(110,235,170,.55);
  font-variant-numeric:tabular-nums;
}
.velocity__boost.is-on{display:block;animation:boostIn .34s var(--ease-out) both,boostPulse 1.1s ease-in-out .34s infinite}
@keyframes boostIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes boostPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.velocity__fin{
  width:100%;text-align:center;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;letter-spacing:.06em;line-height:1.2;
  color:#FFFFFF;
  text-shadow:0 1px 10px rgba(0,0,0,.98),0 0 20px rgba(0,0,0,.75);
  background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:8px 10px;
}
#velocityWrap.is-hot .velocity__fill{
  filter:brightness(1.22) saturate(1.24);
  box-shadow:0 0 32px rgba(255,60,40,.68),0 0 60px rgba(255,150,60,.38),inset 0 1px 0 rgba(255,255,255,.9);
}
#velocityWrap.is-hot .velocity__glow{opacity:1}
#velocityWrap.is-goal{
  border-color:rgba(255,180,71,.44);
  box-shadow:0 28px 80px rgba(0,0,0,.68),0 0 38px rgba(255,180,71,.26),inset 0 1px 0 rgba(255,255,255,.10);
}
#velocityWrap.is-goal .velocity__goal{
  background:linear-gradient(90deg,#FF8A2E,#FFB547);
  color:#000;border-color:rgba(255,180,71,.95);
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,180,71,.55);
}
#velocityWrap.is-goal .velocity__pct{color:#FFB547}
#velocityWrap.is-overdrive{animation:velPulse .52s var(--ease-out) 3}
@keyframes velPulse{0%,100%{transform:scale(1)}40%{transform:scale(1.07);filter:brightness(1.32)}70%{transform:scale(.98)}}
/* turbo actif (barre a 100 %) : toute la carte bascule en vert-menthe, comme le badge */
#velocityWrap.is-boost{
  border-color:rgba(110,235,170,.55);
  box-shadow:0 28px 80px rgba(0,0,0,.68),0 0 46px rgba(110,235,170,.34),inset 0 1px 0 rgba(255,255,255,.10);
}
#velocityWrap.is-boost .velocity__pct{color:#8DF3AC}
#velocityWrap.is-boost .velocity__fill{
  filter:brightness(1.3) saturate(1.3);
  box-shadow:0 0 38px rgba(110,235,170,.6),0 0 74px rgba(78,227,196,.34),inset 0 1px 0 rgba(255,255,255,.95);
}
#velocityWrap.is-boost .velocity__goal{
  background:linear-gradient(90deg,#6BE585,#4EE3C4);color:#08101C;border-color:rgba(122,255,190,.95);
}
#velocityWrap.is-boost .velocity__chrono{animation-duration:.5s}
#velocityWrap.no-metrics .velocity__metrics{display:none}
.velocity__mpm{display:none}


/* — Stagger des entrées (65 ms entre blocs) — */
.head,#question,.opts,.foot{opacity:0;transform:translateY(10px);
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
#card.is-live .head{transition-delay:.08s}
#card.is-live #question{transition-delay:.15s}
#card.is-live .opts{transition-delay:.22s}
#card.is-live .foot{transition-delay:.3s}
#card.is-live .head,#card.is-live #question,#card.is-live .opts,#card.is-live .foot{opacity:1;transform:none}
</style>
</head>
<body>
<div id="scene">
  <div id="bgSim" hidden></div>

  <div id="card" aria-hidden="true">
    <div class="pad">
      <div class="head">
        <span class="mark7g"><img src="assets/logo-7g.png?v=30" alt="7G"></span>
        <div class="chip" id="chip"><span class="dot"></span><span id="chipTxt">DÉBAT EN DIRECT</span></div>
        <div id="timer"><span id="tMin">--</span><span id="tColon">:</span><span id="tSec">--</span></div>
      </div>

      <h1 id="question">—</h1>

      <div class="opts">
        <div class="opt" id="optA" data-choice="A">
          <div class="lbl"><span class="ab ab--a">A</span><div class="lbl__row"><span class="lbl__t" id="lblA">—</span><span class="tag">GAGNANT</span></div></div>
          <div class="bar"><div class="fill fill--a" id="fillA"></div></div>
          <div class="pct" id="pctA">—</div>
        </div>
        <div class="opt" id="optB" data-choice="B">
          <div class="lbl"><span class="ab ab--b">B</span><div class="lbl__row"><span class="lbl__t" id="lblB">—</span><span class="tag">GAGNANT</span></div></div>
          <div class="bar"><div class="fill fill--b" id="fillB"></div></div>
          <div class="pct" id="pctB">—</div>
        </div>
        <div class="opt" id="optC" data-choice="C" hidden>
          <div class="lbl"><span class="ab ab--c">C</span><div class="lbl__row"><span class="lbl__t" id="lblC">—</span><span class="tag">GAGNANT</span></div></div>
          <div class="bar"><div class="fill fill--c" id="fillC"></div></div>
          <div class="pct" id="pctC">—</div>
        </div>
        <div class="opt" id="optD" data-choice="D" hidden>
          <div class="lbl"><span class="ab ab--d">D</span><div class="lbl__row"><span class="lbl__t" id="lblD">—</span><span class="tag">GAGNANT</span></div></div>
          <div class="bar"><div class="fill fill--d" id="fillD"></div></div>
          <div class="pct" id="pctD">—</div>

      <div class="foot">
        <span id="total">0 VOTES</span>

    <div class="timebar" aria-hidden="true"><div class="timebar__fill" id="timeFill"></div></div>
  </div>

  <!-- ═══ CHAT TWITCH — panneau gauche (fictif en démo, réel via le pont) ═══ -->
  <div class="chat" id="chat" aria-hidden="true">
    <div class="chat__head"><span class="dot"></span><span id="chatTitle">CHAT DE 7GIONNY</span><span class="mark7g"><img src="assets/logo-7g.png?v=30" alt="7G"></span></div>
    <div class="chat__pin" id="chatPin"></div>
    <div class="chat__list" id="chatList"></div>
    <div class="chat__goal" id="chatGoal">
      <div class="goal__history" id="goalHistory"></div>
      <div class="goal__main" id="goalMain">
        <div class="goal__top"><span class="goal__label goal__label--current" id="goalLabel">SUB GOAL</span><span class="goal__count" id="goalCount">0 / 50</span></div>
        <div class="goal__bar"><div class="goal__fill" id="goalFill"></div></div>
      </div>
      <div class="goal__next" id="goalNext" hidden>
        <div class="goal__sep"><span></span></div>
        <div class="goal__top"><span class="goal__label goal__label--next" id="goalNextLabel">NEXT</span><span class="goal__count goal__count--next" id="goalNextCount">0 / 6</span></div>
        <div class="goal__bar goal__bar--next"><div class="goal__fill goal__fill--next" id="goalNextFill"></div></div>

  <!-- ═══ ALERTES — haut centre : follow / sub / gift / raid ═══ -->

  <!-- ═══ VÉLOCITÉ CHAT V5 — % gros lisible + fin prévue + chrono auto ═══ -->
  <div id="velocityWrap" class="is-on" aria-hidden="true">
    <div class="velocity__trackWrap">
      <div class="velocity__track" id="velocityTrack">
        <div class="velocity__fill" id="velocityFill"></div>
        <div class="velocity__glow" id="velocityGlow"></div>

      <span class="velocity__pct" id="velocityPct">0%</span>
      <span class="velocity__mpm" id="velocityMpm">0 MPM</span>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Moteur du widget — JS pur, zéro dépendance
   Modes :
     /widget.html            → mode OBS (transparent, connecté au pont)
     ?demo=1&bg=1&loop=1     → démo autonome (aucun serveur requis)
     ?ws=http://host:8321    → pont externe
     ?mute=1                 → silencie le sound design
   ═══════════════════════════════════════════════════════════════════ */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const scene = $('scene'), card = $('card'), bgSim = $('bgSim');
const E = {
  chip: $('chip'), chipTxt: $('chipTxt'), timer: $('timer'), question: $('question'),
  lblA: $('lblA'), lblB: $('lblB'), lblC: $('lblC'), lblD: $('lblD'),
  fillA: $('fillA'), fillB: $('fillB'), fillC: $('fillC'), fillD: $('fillD'),
  pctA: $('pctA'), pctB: $('pctB'), pctC: $('pctC'), pctD: $('pctD'),
  total: $('total'), hint: $('hint'),
  tMin: $('tMin'), tSec: $('tSec'), timeFill: $('timeFill'),
  optA: $('optA'), optB: $('optB'), optC: $('optC'), optD: $('optD')
};

/* ── Paramètres d'URL ─────────────────────────────────────────── */
const q = new URLSearchParams(window.__AUTO__ || '');
for (const [k, v] of new URLSearchParams(location.search)) q.set(k, v);
const MUTE = q.get('mute') === '1';
const DEMO = q.get('demo') === '1';
const LOOP = q.get('loop') === '1';
const BG   = q.get('bg')   === '1';
const API  = q.get('ws') || (location.protocol.startsWith('http') ? location.origin : 'http://localhost:8321');

if (BG) { bgSim.hidden = false; card.style.pointerEvents = 'auto'; }

/* ── Mise à l'échelle de la scène 1920×1080 ───────────────────── */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  scene.style.transform = 'scale(' + s + ')';
  scene.style.left = Math.max(0, (innerWidth  - 1920 * s) / 2) + 'px';
  scene.style.top  = Math.max(0, (innerHeight - 1080 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ═══════════════════════════════════════════════════════════════
   SOUND DESIGN — 100 % synthétisé en Web Audio (aucun fichier,
   aucune musique, aucun instrument : bruitages de signal uniquement)
   ═══════════════════════════════════════════════════════════════ */
let ctx = null, attempts = 0;
function audio() {
  if (MUTE) return null;
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
    if (++attempts > 60) return null;               // autoplay bloqué → on se tait proprement
  }
  return ctx.state === 'running' ? ctx : null;
}
addEventListener('pointerdown', () => audio());
addEventListener('visibilitychange', () => audio());

function noiseBuffer(c, dur) {
  const b = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

/* 1) Impact de basse lourd — apparition du débat */
function sfxDrop() {
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(58, t);
  o.frequency.exponentialRampToValueAtTime(26, t + .8);
  const g = c.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.85, t + .025);
  g.gain.exponentialRampToValueAtTime(.0001, t + 1);
  const n = c.createBufferSource(); n.buffer = noiseBuffer(c, 1);
  const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(1000, t);
  f.frequency.exponentialRampToValueAtTime(50, t + .9);
  const ng = c.createGain();
  ng.gain.setValueAtTime(.32, t);
  ng.gain.exponentialRampToValueAtTime(.0001, t + .9);
  o.connect(g).connect(c.destination);
  n.connect(f).connect(ng).connect(c.destination);
  o.start(t); o.stop(t + 1.05); n.start(t);
}

/* 2) Click mécanique discret — changement de leader */
function sfxTick() {
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const n = c.createBufferSource(); n.buffer = noiseBuffer(c, .05);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.1;
  const g = c.createGain();
  g.gain.setValueAtTime(.16, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .045);
  n.connect(f).connect(g).connect(c.destination); n.start(t);
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 1400;
  const og = c.createGain();
  og.gain.setValueAtTime(.07, t);
  og.gain.exponentialRampToValueAtTime(.0001, t + .03);
  o.connect(og).connect(c.destination); o.start(t); o.stop(t + .05);
}

/* 3) Validation nette — clôture / sentence */
function sfxConfirm() {
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 720;
  const g = c.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.38, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + .5);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .55);
  const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 1440;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(.0001, t + .015);
  g2.gain.exponentialRampToValueAtTime(.1, t + .03);
  g2.gain.exponentialRampToValueAtTime(.0001, t + .28);
  o2.connect(g2).connect(c.destination); o2.start(t); o2.stop(t + .3);
}

/* ── Lecture HTML Audio : bruitages rendus (sounds/*.wav) ─────────
   Fichiers hébergés dans le projet (zéro asset externe).
   Si l'autoplay reste bloqué après 3 essais → repli sur le synthé. */
const SOUNDS = {
  impact:  { el: new Audio('sounds/impact.wav'),  vol: 0.95, fb: sfxDrop },
  click:   { el: new Audio('sounds/click.wav'),   vol: 0.5,  fb: sfxTick },
  victory: { el: new Audio('sounds/victory.wav'), vol: 0.95, fb: sfxConfirm },
  clock:   { el: new Audio('sounds/clock.wav'),   vol: 0.22 }
};
for (const k in SOUNDS) { SOUNDS[k].el.preload = 'auto'; SOUNDS[k].el.volume = SOUNDS[k].vol; }
let htmlFails = 0, useSynth = false, unlocked = false;
function unlockAudio() {
  // debloque l'audio au premier geste (navigateur) + pour OBS
  try{
    const c=audio();
    if(c && c.state==='suspended') c.resume().catch(()=>{});
  }catch(e){}
  if (unlocked) return;
  unlocked = true;
  for (const k in SOUNDS) {
    const el = SOUNDS[k].el;
    try{
      el.muted = true;
      const p=el.play();
      if(p && p.then) p.then(() => { el.pause(); el.currentTime = 0; el.muted=false; }).catch(() => { el.muted=false; });
      else el.muted=false;
    }catch(e){ try{ el.muted=false; }catch(e2){} }
  }
  // aussi debloque les alertes
  for(const k in alertAudio){
    try{
      const a=alertAudio[k];
      a.muted=true;
      const p=a.play();
      if(p && p.then) p.then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; });
      else a.muted=false;
    }catch(e){}
  }
}
addEventListener('pointerdown', unlockAudio);
/* — Sons sondage : SUPPRIMÉS sur demande (zéro son pour débat) — */
const SFX = { impact: false, click: false, victory: false };
function playSound(name) {
  if (MUTE || !SFX[name]) return;
  const s = SOUNDS[name];
  if (!s) return;
  if (useSynth && s.fb) { s.fb(); return; }
  s.el.currentTime = 0;
  const p = s.el.play();
  if (p && p.catch) p.catch(() => { if (++htmlFails >= 3) useSynth = true; if (s.fb) s.fb(); });
}

/* — Tic-tac de chrono : boucle discrète pendant tout le débat — */
function sfxClockSoft() {                    // repli synthé du tic-tac
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const n = c.createBufferSource(); n.buffer = noiseBuffer(c, .03);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2800; f.Q.value = 1.2;
  const g = c.createGain();
  g.gain.setValueAtTime(.05, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .025);
  n.connect(f).connect(g).connect(c.destination); n.start(t);
}
let clockTimer = null, clockStartT = null;
function startClock() {
  return; // sondage sans son sur demande
  if (MUTE || clockTimer) return;
  const el = SOUNDS.clock.el;
  el.loop = true; el.currentTime = 0; el.playbackRate = 1;
  el.play().catch(() => { if (!clockTimer) startClockFallback(); });
}
/* repli synthé : self-rescheduling → s'accélère aussi dans les 5 dernières s */
function startClockFallback() {
  if (clockTimer) return;
  clockFallbackTick();
}
function clockFallbackTick() {
  sfxClockSoft();
  const rem = cur ? Math.max(0, (cur.endsAt || 0) - Date.now()) : 999999;
  const iv = rem <= 5000 ? Math.max(170, 500 - ((5000 - rem) / 5000) * 330) : 500;
  clockTimer = setTimeout(clockFallbackTick, iv);
}
function stopClock() {
  const el = SOUNDS.clock.el;
  el.pause(); el.currentTime = 0; el.playbackRate = 1;
  if (clockTimer) { clearTimeout(clockTimer); clockTimer = null; }
}

/* ═══════════════════════════════════════════════════════════════
   MACHINE À ÉTATS  ·  idle → live → ended → (sortie) → idle
   ═══════════════════════════════════════════════════════════════ */
let mode = 'idle';          // idle | live | ended
let cur = null;             // état courant envoyé par le pont
let lastLeader = null, tickLock = 0, exiting = false;
let endTimer = null, exitTimer = null;

let debateTotal = 0;              // durée totale du débat courant (barre de décompte)
function setTimer(ms) {
  if (ms < 0) ms = 0;
  const s = Math.ceil(ms / 1000);
  E.tMin.textContent = String(Math.floor(s / 60)).padStart(2, '0');
  E.tSec.textContent = String(s % 60).padStart(2, '0');
}

/* — Retour visuel avance / recul (flash 550 ms par option) — */
let lastP = { A: null, B: null, C: null, D: null };
const pulseT = { A: null, B: null, C: null, D: null };
function pulse(c, dir) {
  const opt = E['opt'+c];
  if (!opt) return;
  opt.classList.remove('is-up', 'is-down');
  void opt.offsetWidth;
  opt.classList.add(dir);
  clearTimeout(pulseT[c]);
  pulseT[c] = setTimeout(() => opt.classList.remove('is-up', 'is-down'), 550);
}

function render() {
  if (!cur) return;
  const now = Date.now();
  const va = cur.va || 0, vb = cur.vb || 0, vc = cur.vc || 0, vd = cur.vd || 0;
  const tot = va + vb + vc + vd;
  const pct = (v) => tot ? Math.round(v / tot * 100) : 0;
  const pA = pct(va), pB = pct(vb), pC = pct(vc), pD = pct(vd);
  let adjB = pB;
  if (tot && !cur.c && !cur.d) adjB = 100 - pA;
  E.fillA.style.width = pA + '%';
  E.fillB.style.width = adjB + '%';
  if (E.fillC) E.fillC.style.width = pC + '%';
  if (E.fillD) E.fillD.style.width = pD + '%';
  E.pctA.textContent = tot ? pA + '%' : '—';
  E.pctB.textContent = tot ? adjB + '%' : '—';
  if (E.pctC) E.pctC.textContent = cur.c ? (tot ? pC + '%' : '—') : '—';
  if (E.pctD) E.pctD.textContent = cur.d ? (tot ? pD + '%' : '—') : '—';

  if (mode === 'live' && tot > 0) {
    if (lastP.A !== null) {
      if (pA !== lastP.A) pulse('A', pA > lastP.A ? 'up' : 'down');
      if (adjB !== lastP.B) pulse('B', adjB > lastP.B ? 'up' : 'down');
      if (cur.c && pC !== lastP.C) pulse('C', pC > lastP.C ? 'up' : 'down');
      if (cur.d && pD !== lastP.D) pulse('D', pD > lastP.D ? 'up' : 'down');
    }
    lastP.A = pA; lastP.B = adjB; lastP.C = pC; lastP.D = pD;
  }
  const scores = [{k:'A',v:va},{k:'B',v:vb}];
  if (cur.c) scores.push({k:'C',v:vc});
  if (cur.d) scores.push({k:'D',v:vd});
  scores.sort((a,b)=>b.v-a.v);
  const lead = tot ? (scores[0].v > (scores[1]?.v||-1) ? scores[0].k : null) : null;
  ['A','B','C','D'].forEach(k=>{
    const el = E['pct'+k];
    if (el) el.classList.toggle('is-lead', lead === k);
  });
  if (mode === 'live' && lead && lead !== lastLeader && now - tickLock > 350) {
    playSound('click');
    const f = E['fill'+lead];
    if (f) { f.classList.add('is-flash'); setTimeout(()=>f.classList.remove('is-flash'),130); }
    tickLock = now;
  }
  if (mode === 'live') lastLeader = lead;

  const rem = (cur.endsAt || 0) - now;
  setTimer(rem);
  const low = mode === 'live' && rem <= 15000;
  E.timer.classList.toggle('is-low', low);
  card.classList.toggle('is-low', low);
  if (mode === 'live' && debateTotal > 0) {
    E.timeFill.style.width = (Math.max(0, Math.min(1, rem / debateTotal)) * 100).toFixed(2) + '%';
  } else if (mode === 'ended') {
    E.timeFill.style.width = '0%';
  }
  if (!MUTE) {
    const cl = SOUNDS.clock.el;
    cl.volume = low ? 0.3 : 0.22;
    cl.playbackRate = (mode === 'live' && rem <= 5000)
      ? Math.min(2.6, 1 + (1 - rem / 5000) * 1.6)
      : 1;
  }
  card.classList.toggle('is-critical', mode === 'live' && rem <= 5000);
  E.total.textContent = tot.toLocaleString('fr-FR') + (tot > 1 ? ' VOTES' : ' VOTE');
}

/* — Consigne de vote : mots-clés fluides, plus de !vote A/B — */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function displayKeyword(opt) {
  const words = String(opt || '').replace(/["'«»]/g, ' ').split(/\s+/)
    .map(w => w.replace(/^[^A-Za-zÀ-ÖØ-öø-ÿ0-9]+|[^A-Za-zÀ-ÖØ-öø-ÿ0-9]+$/g, ''))
    .filter(w => w.length >= 2);
  return (words[0] || '').slice(0, 18);
}
function voteHint(a,b,c,d) {
  const opts = [a,b,c,d].filter(Boolean);
  const keys = opts.map(displayKeyword).filter(Boolean);
  const uniq = [...new Set(keys.map(k=>k.toLowerCase()))];
  if (keys.length >=2 && uniq.length >=2 && keys.length <=4) {
    const quoted = keys.map(k=>'« '+esc(k)+' »').join(' / ');
    return 'TAPEZ '+quoted+' DANS LE CHAT';
  }
  if (c && d) return 'A / B / C / D DANS LE CHAT';
  if (c) return 'A / B / C DANS LE CHAT';
  return 'A / B DANS LE CHAT';
}

function updateAlertPosForSondage(){
  try{
    const alertsEl = document.getElementById('alerts');
    const cfg = window._alertCfg;
    if (!alertsEl || !cfg) return;
    const isLive = card && card.classList.contains('is-live');
    const top = isLive ? (cfg.posYLive!=null?cfg.posYLive:360) : (cfg.posY!=null?cfg.posY:140);
    alertsEl.style.top = top + 'px';
    alertsEl.style.left = (cfg.posX!=null?cfg.posX:58) + '%';
  }catch(e){}
}
function beginExit() {
  if (exiting) return;
  exiting = true;
  card.classList.add('is-exit');
  exitTimer = setTimeout(() => {
    card.classList.remove('is-live');
    card.classList.add('is-hidden');
    mode = 'idle'; cur = null; lastLeader = null; exiting = false;
    E.timer.classList.add('is-off');
    updateAlertPosForSondage();
  }, 460);
}

function setState(next) {
  const prev = mode;
  clearTimeout(endTimer); clearTimeout(exitTimer);
  mode = next.mode;

  if (next.mode === 'idle') {
    if (mode !== 'idle') mode = prev;             // on restaure (sortie pilotée ci-dessous)
    if (prev === 'live' && !exiting) beginExit(); // le pont a tout coupé → sortie animée
    else if (prev === 'ended' && !exiting) beginExit();
    mode = 'idle'; cur = null; lastLeader = null;
    E.timer.classList.add('is-off');
    return;
  }

  exiting = false;
  card.classList.remove('is-hidden', 'is-exit');
  cur = next;
  E.question.textContent = next.question;
  E.lblA.textContent = next.a;
  E.lblB.textContent = next.b;
  if (E.lblC) E.lblC.textContent = next.c || '—';
  if (E.lblD) E.lblD.textContent = next.d || '—';
  if (E.optC) E.optC.hidden = !next.c;
  if (E.optD) E.optD.hidden = !next.d;
  E.timer.classList.remove('is-off');
  setTimer((next.endsAt || 0) - Date.now());
  E.hint.innerHTML = next.source === 'twitch'
    ? 'SONDAGE TWITCH · EN COURS'
    : next.source === 'demo'
      ? 'MODE APERÇU'
      : voteHint(next.a, next.b, next.c, next.d);

  if (next.mode === 'live') {
    if (next.startsAt) debateTotal = Math.max(2000, next.endsAt - next.startsAt);
    else if (prev === 'idle') debateTotal = Math.max(2000, next.endsAt - Date.now());
    if (prev === 'idle') {
      lastP.A = 0; lastP.B = 0; lastP.C = 0; lastP.D = 0;
      playSound('impact');
      clearTimeout(clockStartT);
      clockStartT = setTimeout(startClock, 250);
    }
    E.chip.classList.remove('is-result');
    E.chipTxt.textContent = 'DÉBAT EN DIRECT';
    ['A','B','C','D'].forEach(k=>{
      const o=E['opt'+k];
      if(o) o.classList.remove('is-winner','is-loser');
    });
    card.classList.add('is-live');
    updateAlertPosForSondage();
    render();
  }
  else if (next.mode === 'ended') {
    E.chip.classList.add('is-result');
    E.chipTxt.textContent = 'RÉSULTAT';
    E.timer.classList.add('is-off');
    lastP.A = lastP.B = lastP.C = lastP.D = null;
    clearTimeout(clockStartT); stopClock();
    E.timeFill.style.width = '0%';
    const va = next.va || 0, vb = next.vb || 0, vc = next.vc || 0, vd = next.vd || 0;
    const scores = [{k:'A',v:va},{k:'B',v:vb}];
    if (next.c) scores.push({k:'C',v:vc});
    if (next.d) scores.push({k:'D',v:vd});
    scores.sort((a,b)=>b.v-a.v);
    const w = next.winner || (scores[0]?.k || 'A');
    const winOpt = E['opt'+w];
    if (winOpt) winOpt.classList.add('is-winner');
    ['A','B','C','D'].forEach(k=>{
      if(k!==w){
        const o=E['opt'+k];
        if(o && !o.hidden) o.classList.add('is-loser');
      }
    });
    card.classList.add('is-live');
    render();
    playSound('victory');
    endTimer = setTimeout(beginExit, 5000);
  }
}

let lastMsg = 0, es = null, pollTimer = null;

function apply(m) {
  if (!m) return;
  lastMsg = Date.now();
  if (m.sound) { try { if (window.__refreshAlertSounds) window.__refreshAlertSounds(true); } catch (e) {} return; }   // V41 : son change dans le panneau
  if (m.chat) { pushChat(m); return; }      // message du vrai chat (via le pont)
  if (m.badgeMap) { badgeMap = m.badgeMap; return; }   // vrais badges Twitch (images)
  if (m.pin) { m.pin === 0 ? clearPin() : setPin(m); return; }   // message épinglé
  if (m.velocityReset) { if (window.velocityReset) window.velocityReset(); return; }
  if (m.velocityValidate) { if (window.velocityValidate) window.velocityValidate(); return; }
  /* sub goal et/ou config (titre + accent + velocity) — le pont les envoie parfois
     ensemble : on applique les deux, sans retour prématuré */
  if (m.goal || m.cfg || m.velocity) {
    if (m.goal) setGoal(m);
    if (m.cfg || m.velocity) applyConfig(m);

  }

  if (m.mode) setState(m);
}

/* — Applique le titre du chat + la couleur d'accent + velocity config — */
function hexToRgb(hex){
  try{
    let h = String(hex||'').trim().replace('#','');
    if(h.length===3) h = h.split('').map(ch=>ch+ch).join('');
    const n = parseInt(h,16);
    if(isNaN(n)) return null;
    return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
  }catch(e){ return null; }
}
function darkenHex(hex, amt){
  const rgb = hexToRgb(hex);
  if(!rgb) return hex;
  const d = (v)=> Math.max(0, Math.min(255, Math.round(v*(1-amt))));
  const toHex = (v)=> v.toString(16).padStart(2,'0');
  return '#'+toHex(d(rgb.r))+toHex(d(rgb.g))+toHex(d(rgb.b));
}

  if (c.alertsMaster !== undefined) {

const chatPanel = $('chat'), chatList = $('chatList');

const CHAT_COLORS = ['#FFD166','#FF7B9C','#6BE585','#5EC8F2','#FF9F45','#C79BFF','#4EE3C4','#FF6B6B'];
function chatColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return CHAT_COLORS[Math.abs(h) % CHAT_COLORS.length];

/* — Badge Twitch : VRAIE image officielle (reçue du pont via badgeMap).
     Si l'image n'est pas encore chargée ou inconnue → chip texte en repli. — */
const BADGE_CHIP = { broadcaster: 'STREAMER', moderator: 'MOD', vip: 'VIP', staff: 'STAFF',
  admin: 'ADMIN', global_mod: 'GMOD', premium: 'PRIME', turbo: 'TURBO', bits: v => 'BITS ' + v,

function makeBadge(id, version) {

      : (BADGE_CHIP[id] || id.toUpperCase().slice(0, 5));

/* — Texte du message : emotes/GIFs Twitch tokenisés + URLs .gif/.webp brutes — */
function appendMsg(cm, m) {
  const text = String(m.msg || '').slice(0, 200);
  let items = [];
  if (m.emotes) {
    let sets = {};
    try { sets = JSON.parse(m.emoteSets || '{}'); } catch (e) {}
    items = String(m.emotes).split('/').filter(Boolean).map(p => {
      const i = p.indexOf(':'); if (i < 0) return null;
      const id = p.slice(0, i);
      const rng = p.slice(i + 1).split('-').map(Number);
      if (!isFinite(rng[0]) || !isFinite(rng[1])) return null;
      return { id, s: rng[0], e: rng[1], animated: sets[id] === 1 || sets[id] === true };
    }).filter(Boolean).sort((a, b) => a.s - b.s);
  }
  let pos = 0;
  for (const it of items) {
    if (it.s < pos || it.e >= text.length) continue;
    if (it.s > pos) cm.appendChild(document.createTextNode(text.slice(pos, it.s)));
    const img = document.createElement('img');
    img.className = 'cemote';
    // Twitch a DEUX formats d'emotes :
    //   - ancien : IDs numériques (ex. 30251) → /emotes/v1/{id}/3.0
    //   - nouveau : IDs "emotesv2_..." → /emoticons/v2/{id}/default/dark/3.0
    img.src = String(it.id).startsWith('emotesv2_')
      ? 'https://static-cdn.jtvnw.net/emoticons/v2/' + it.id + '/default/dark/3.0'
      : 'https://static-cdn.jtvnw.net/emotes/v1/' + it.id + '/3.0';
    img.alt = text.slice(it.s, it.e + 1);
    img.onerror = () => { try { img.replaceWith(document.createTextNode(img.alt)); } catch (e) {} };
    cm.appendChild(img);
    pos = it.e + 1;
  }
  if (pos < text.length) {
    /* GIFs / WebP inline : URL externes ou locales (ex. démo) */
    const parts = text.slice(pos).split(/(https?:\/\/[^\s]+\.(?:gif|webp)(?:\?[^\s]*)?|demo\/[\w.-]+\.(?:gif|webp))/i);
    let n = 0;
    for (const part of parts) {
      if (!part) continue;
      if (/^(https?:\/\/[^\s]+\.(?:gif|webp)|demo\/[\w.-]+\.(?:gif|webp))/i.test(part) && n < 2) {
        const g = document.createElement('img');
        g.className = 'cemote'; g.src = part; g.alt = 'gif';
        g.onerror = () => { try { g.replaceWith(document.createTextNode('[gif]')); } catch (e) {} };
        cm.appendChild(g); n++;
      } else cm.appendChild(document.createTextNode(part));
    }
  }
}
/* — Ligne de message complète : [badges] [pseudo] [↪ réponse / texte] — */
function buildMsgRow(m, withPinIcon) {
  const role = m.role === 'me' ? 'me' : (m.role === 'mod' ? 'mod' : 'user');
  const d = document.createElement('div');
  d.className = 'cmsg' + (m.highlight ? ' is-hl' : '');

    d.appendChild(f);
  }
  if (m.badges && typeof m.badges === 'object' && Object.keys(m.badges).length) {
    const bb = document.createElement('span'); bb.className = 'cbadges';
    for (const [id, v] of Object.entries(m.badges).slice(0, 4)) bb.appendChild(makeBadge(id, v));
    d.appendChild(bb);
  }
  const cn = document.createElement('span');
  cn.className = 'cn' + (role !== 'user' ? ' cn--' + role : '');
  cn.textContent = String(m.user || 'spectateur').slice(0, 24) + ':';   // « pseudo : » (deux-points)
  if (m.color) cn.style.color = m.color;                     // vraie couleur Twitch
  else if (role === 'user') cn.style.color = chatColor(cn.textContent);
  const cb = document.createElement('span'); cb.className = 'cbody';
  if (m.replyTo) {
    const r = document.createElement('span'); r.className = 'creply';
    r.textContent = '↪ ';
    const b = document.createElement('b'); b.textContent = '@' + String(m.replyTo).slice(0, 24);
    r.appendChild(b);
    cb.appendChild(r);
  }
  const ct = document.createElement('span'); ct.className = 'ctext';
  appendMsg(ct, m);
  cb.appendChild(ct);
  d.appendChild(cn); d.appendChild(cb);
  return d;
}

/* — SONS D'ALERTES PERSONNALISABLES —

     sounds/alert-raid.*    → RAID
   Volume 0.75 pour éviter craquement / clipping. Single playback garanti.
   Le panneau upload directement ici via /api/sounds. */
const ALERT_SOUNDS = { follow: 0.75, sub: 0.75, gift: 0.75, resub: 0.75, raid: 0.75, prime: 0.75, anon: 0.75, community: 0.75, default: 0.75 };
const alertAudio = {};
const alertAudioStamp = {};
let alertAudioReady = false;
const SOUND_KINDS = ['follow','sub','resub','gift','anon','community','prime','raid','default'];
/* — Sons d'alerte : la LISTE vient du pont (1 requête), plus de tempête de 404.
   V41 : l'ancien code faisait `if (alertAudio[kind]) break;` a l'interieur de la boucle
   des types → des qu'un type avait un son, TOUS les types suivants n'etaient jamais
   charges (impossible de changer/ajouter le son d'un sub, d'un raid…). Corrige +
   le remplacement d'un fichier est detecte (mtime) et le pont previent en direct. — */
function alertProbe(url) {
  return new Promise(res => {
    const a = new Audio();
    let done = false;
    const ok = () => { if (done) return; done = true; clearTimeout(t); try { a.removeEventListener('error', fail); } catch (e) {} res(a); };
    const fail = () => { if (done) return; done = true; try { a.removeEventListener('canplaythrough', ok); } catch (e) {} res(null); };
    const t = setTimeout(fail, 5000);
    a.preload = 'auto';
    a.addEventListener('canplaythrough', ok, { once: true });
    a.addEventListener('loadeddata', ok, { once: true });
    a.addEventListener('error', fail, { once: true });
    a.src = url;                       // mis en dernier : c'est la ce qui declenche le chargement
  });
}
async function refreshAlertSounds(force) {
  let list = null;

    const j = await r.json();
    if (j && Array.isArray(j.files)) list = j.files;
  } catch (e) {}
  const byKind = {};
  if (list) {
    for (const f of list) {
      const kind = String(f.type || '').toLowerCase();
      if (SOUND_KINDS.indexOf(kind) === -1 || byKind[kind]) continue;
      byKind[kind] = ['sounds/' + f.file + '?v=' + (f.mtime || f.size || Date.now())];
    }
  } else {
