/* ── Mise à l'échelle de la scène 1920×1080 ───────────────────── */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  scene.style.transform = 'scale(' + s + ')';
  scene.style.left = Math.max(0, (innerWidth  - 1920 * s) / 2) + 'px';
  scene.style.top  = Math.max(0, (innerHeight - 1080 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ═══════════════════════════════════════════════════════════════
   SOUND DESIGN — 100 % synthétisé en Web Audio (aucun fichier,
   aucune musique, aucun instrument : bruitages de signal uniquement)
   ═══════════════════════════════════════════════════════════════ */
let ctx = null, attempts = 0;
function audio() {
  if (MUTE) return null;
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
    if (++attempts > 60) return null;               // autoplay bloqué → on se tait proprement
  }
  return ctx.state === 'running' ? ctx : null;
}
addEventListener('pointerdown', () => audio());
addEventListener('visibilitychange', () => audio());

function noiseBuffer(c, dur) {
  const b = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

/* 1) Impact de basse lourd — apparition du débat */
function sfxDrop() {
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(58, t);
  o.frequency.exponentialRampToValueAtTime(26, t + .8);
  const g = c.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.85, t + .025);
  g.gain.exponentialRampToValueAtTime(.0001, t + 1);
  const n = c.createBufferSource(); n.buffer = noiseBuffer(c, 1);
  const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(1000, t);
  f.frequency.exponentialRampToValueAtTime(50, t + .9);
  const ng = c.createGain();
  ng.gain.setValueAtTime(.32, t);
  ng.gain.exponentialRampToValueAtTime(.0001, t + .9);
  o.connect(g).connect(c.destination);
  n.connect(f).connect(ng).connect(c.destination);
  o.start(t); o.stop(t + 1.05); n.start(t);
}

/* 2) Click mécanique discret — changement de leader */
function sfxTick() {
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const n = c.createBufferSource(); n.buffer = noiseBuffer(c, .05);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.1;
  const g = c.createGain();
  g.gain.setValueAtTime(.16, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .045);
  n.connect(f).connect(g).connect(c.destination); n.start(t);
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 1400;
  const og = c.createGain();
  og.gain.setValueAtTime(.07, t);
  og.gain.exponentialRampToValueAtTime(.0001, t + .03);
  o.connect(og).connect(c.destination); o.start(t); o.stop(t + .05);
}

/* 3) Validation nette — clôture / sentence */
function sfxConfirm() {
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 720;
  const g = c.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.38, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + .5);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .55);
  const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 1440;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(.0001, t + .015);
  g2.gain.exponentialRampToValueAtTime(.1, t + .03);
  g2.gain.exponentialRampToValueAtTime(.0001, t + .28);
  o2.connect(g2).connect(c.destination); o2.start(t); o2.stop(t + .3);
}

/* ── Lecture HTML Audio : bruitages rendus (sounds/*.wav) ─────────
   Fichiers hébergés dans le projet (zéro asset externe).
   Si l'autoplay reste bloqué après 3 essais → repli sur le synthé. */
const SOUNDS = {
  impact:  { el: new Audio('sounds/impact.wav'),  vol: 0.95, fb: sfxDrop },
  click:   { el: new Audio('sounds/click.wav'),   vol: 0.5,  fb: sfxTick },
  victory: { el: new Audio('sounds/victory.wav'), vol: 0.95, fb: sfxConfirm },
  clock:   { el: new Audio('sounds/clock.wav'),   vol: 0.22 }
};
for (const k in SOUNDS) { SOUNDS[k].el.preload = 'auto'; SOUNDS[k].el.volume = SOUNDS[k].vol; }
let htmlFails = 0, useSynth = false, unlocked = false;
function unlockAudio() {
  // debloque l'audio au premier geste (navigateur) + pour OBS
  try{
    const c=audio();
    if(c && c.state==='suspended') c.resume().catch(()=>{});
  }catch(e){}
  if (unlocked) return;
  unlocked = true;
  for (const k in SOUNDS) {
    const el = SOUNDS[k].el;
    try{
      el.muted = true;
      const p=el.play();
      if(p && p.then) p.then(() => { el.pause(); el.currentTime = 0; el.muted=false; }).catch(() => { el.muted=false; });
      else el.muted=false;
    }catch(e){ try{ el.muted=false; }catch(e2){} }
  }
}
addEventListener('pointerdown', unlockAudio);
/* — Sons sondage : SUPPRIMÉS sur demande (zéro son pour débat) — */
const SFX = { impact: false, click: false, victory: false };
function playSound(name) {
  if (MUTE || !SFX[name]) return;
  const s = SOUNDS[name];
  if (!s) return;
  if (useSynth && s.fb) { s.fb(); return; }
  s.el.currentTime = 0;
  const p = s.el.play();
  if (p && p.catch) p.catch(() => { if (++htmlFails >= 3) useSynth = true; if (s.fb) s.fb(); });
}

/* — Tic-tac de chrono : boucle discrète pendant tout le débat — */
function sfxClockSoft() {                    // repli synthé du tic-tac
  const c = audio(); if (!c) return;
  const t = c.currentTime;
  const n = c.createBufferSource(); n.buffer = noiseBuffer(c, .03);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2800; f.Q.value = 1.2;
  const g = c.createGain();
  g.gain.setValueAtTime(.05, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .025);
  n.connect(f).connect(g).connect(c.destination); n.start(t);
}
let clockTimer = null, clockStartT = null;
function startClock() {
  return; // sondage sans son sur demande
  if (MUTE || clockTimer) return;
  const el = SOUNDS.clock.el;
  el.loop = true; el.currentTime = 0; el.playbackRate = 1;
  el.play().catch(() => { if (!clockTimer) startClockFallback(); });
}
/* repli synthé : self-rescheduling → s'accélère aussi dans les 5 dernières s */
function startClockFallback() {
  if (clockTimer) return;
  clockFallbackTick();
}
function clockFallbackTick() {
  sfxClockSoft();
  const rem = cur ? Math.max(0, (cur.endsAt || 0) - Date.now()) : 999999;
  const iv = rem <= 5000 ? Math.max(170, 500 - ((5000 - rem) / 5000) * 330) : 500;
  clockTimer = setTimeout(clockFallbackTick, iv);
}
function stopClock() {
  const el = SOUNDS.clock.el;
  el.pause(); el.currentTime = 0; el.playbackRate = 1;
  if (clockTimer) { clearTimeout(clockTimer); clockTimer = null; }
}

/* ═══════════════════════════════════════════════════════════════
   MACHINE À ÉTATS  ·  idle → live → ended → (sortie) → idle
   ═══════════════════════════════════════════════════════════════ */
let mode = 'idle';          // idle | live | ended
let cur = null;             // état courant envoyé par le pont
let lastLeader = null, tickLock = 0, exiting = false;
let endTimer = null, exitTimer = null;

let debateTotal = 0;              // durée totale du débat courant (barre de décompte)
function setTimer(ms) {
  if (ms < 0) ms = 0;
  const s = Math.ceil(ms / 1000);
  E.tMin.textContent = String(Math.floor(s / 60)).padStart(2, '0');
  E.tSec.textContent = String(s % 60).padStart(2, '0');
}

/* — Retour visuel avance / recul (flash 550 ms par option) — */
let lastP = { A: null, B: null, C: null, D: null };
const pulseT = { A: null, B: null, C: null, D: null };
function pulse(c, dir) {
  const opt = E['opt'+c];
  if (!opt) return;
  opt.classList.remove('is-up', 'is-down');
  void opt.offsetWidth;
  opt.classList.add(dir);
  clearTimeout(pulseT[c]);
  pulseT[c] = setTimeout(() => opt.classList.remove('is-up', 'is-down'), 550);
}

function render() {
  if (!cur) return;
  const now = Date.now();
  const va = cur.va || 0, vb = cur.vb || 0, vc = cur.vc || 0, vd = cur.vd || 0;
  const tot = va + vb + vc + vd;
  const pct = (v) => tot ? Math.round(v / tot * 100) : 0;
  const pA = pct(va), pB = pct(vb), pC = pct(vc), pD = pct(vd);
  let adjB = pB;
  if (tot && !cur.c && !cur.d) adjB = 100 - pA;
  E.fillA.style.width = pA + '%';
  E.fillB.style.width = adjB + '%';
  if (E.fillC) E.fillC.style.width = pC + '%';
  if (E.fillD) E.fillD.style.width = pD + '%';
  E.pctA.textContent = tot ? pA + '%' : '—';
  E.pctB.textContent = tot ? adjB + '%' : '—';
  if (E.pctC) E.pctC.textContent = cur.c ? (tot ? pC + '%' : '—') : '—';
  if (E.pctD) E.pctD.textContent = cur.d ? (tot ? pD + '%' : '—') : '—';

  if (mode === 'live' && tot > 0) {
    if (lastP.A !== null) {
      if (pA !== lastP.A) pulse('A', pA > lastP.A ? 'up' : 'down');
      if (adjB !== lastP.B) pulse('B', adjB > lastP.B ? 'up' : 'down');
      if (cur.c && pC !== lastP.C) pulse('C', pC > lastP.C ? 'up' : 'down');
      if (cur.d && pD !== lastP.D) pulse('D', pD > lastP.D ? 'up' : 'down');
    }
    lastP.A = pA; lastP.B = adjB; lastP.C = pC; lastP.D = pD;
  }
  const scores = [{k:'A',v:va},{k:'B',v:vb}];
  if (cur.c) scores.push({k:'C',v:vc});
  if (cur.d) scores.push({k:'D',v:vd});
  scores.sort((a,b)=>b.v-a.v);
  const lead = tot ? (scores[0].v > (scores[1]?.v||-1) ? scores[0].k : null) : null;
  ['A','B','C','D'].forEach(k=>{
    const el = E['pct'+k];
    if (el) el.classList.toggle('is-lead', lead === k);
  });
  if (mode === 'live' && lead && lead !== lastLeader && now - tickLock > 350) {
    playSound('click');
    const f = E['fill'+lead];
    if (f) { f.classList.add('is-flash'); setTimeout(()=>f.classList.remove('is-flash'),130); }
    tickLock = now;
  }
  if (mode === 'live') lastLeader = lead;

  const rem = (cur.endsAt || 0) - now;
  setTimer(rem);
  const low = mode === 'live' && rem <= 15000;
  E.timer.classList.toggle('is-low', low);
  card.classList.toggle('is-low', low);
  if (mode === 'live' && debateTotal > 0) {
    E.timeFill.style.width = (Math.max(0, Math.min(1, rem / debateTotal)) * 100).toFixed(2) + '%';
  } else if (mode === 'ended') {
    E.timeFill.style.width = '0%';
  }
  if (!MUTE) {
    const cl = SOUNDS.clock.el;
    cl.volume = low ? 0.3 : 0.22;
    cl.playbackRate = (mode === 'live' && rem <= 5000)
      ? Math.min(2.6, 1 + (1 - rem / 5000) * 1.6)
      : 1;
  }
  card.classList.toggle('is-critical', mode === 'live' && rem <= 5000);
  E.total.textContent = tot.toLocaleString('fr-FR') + (tot > 1 ? ' VOTES' : ' VOTE');
}

/* — Consigne de vote : mots-clés fluides, plus de !vote A/B — */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function displayKeyword(opt) {
  const words = String(opt || '').replace(/["'«»]/g, ' ').split(/\s+/)
    .map(w => w.replace(/^[^A-Za-zÀ-ÖØ-öø-ÿ0-9]+|[^A-Za-zÀ-ÖØ-öø-ÿ0-9]+$/g, ''))
    .filter(w => w.length >= 2);
  return (words[0] || '').slice(0, 18);
}
function voteHint(a,b,c,d) {
  const opts = [a,b,c,d].filter(Boolean);
  const keys = opts.map(displayKeyword).filter(Boolean);
  const uniq = [...new Set(keys.map(k=>k.toLowerCase()))];
  if (keys.length >=2 && uniq.length >=2 && keys.length <=4) {
    const quoted = keys.map(k=>'« '+esc(k)+' »').join(' / ');
    return 'TAPEZ '+quoted+' DANS LE CHAT';
  }
  if (c && d) return 'A / B / C / D DANS LE CHAT';
  if (c) return 'A / B / C DANS LE CHAT';
  return 'A / B DANS LE CHAT';
}

function beginExit() {
  if (exiting) return;
  exiting = true;
  card.classList.add('is-exit');
  exitTimer = setTimeout(() => {
    card.classList.remove('is-live');
    card.classList.add('is-hidden');
    mode = 'idle'; cur = null; lastLeader = null; exiting = false;
    E.timer.classList.add('is-off');
  }, 460);
}

function setState(next) {
  const prev = mode;
  clearTimeout(endTimer); clearTimeout(exitTimer);
  mode = next.mode;

  if (next.mode === 'idle') {
    if (mode !== 'idle') mode = prev;             // on restaure (sortie pilotée ci-dessous)
    if (prev === 'live' && !exiting) beginExit(); // le pont a tout coupé → sortie animée
    else if (prev === 'ended' && !exiting) beginExit();
    mode = 'idle'; cur = null; lastLeader = null;
    E.timer.classList.add('is-off');
    return;
  }

  exiting = false;
  card.classList.remove('is-hidden', 'is-exit');
  cur = next;
  E.question.textContent = next.question;
  E.lblA.textContent = next.a;
  E.lblB.textContent = next.b;
  if (E.lblC) E.lblC.textContent = next.c || '—';
  if (E.lblD) E.lblD.textContent = next.d || '—';
  if (E.optC) E.optC.hidden = !next.c;
  if (E.optD) E.optD.hidden = !next.d;
  E.timer.classList.remove('is-off');
  setTimer((next.endsAt || 0) - Date.now());
  E.hint.innerHTML = next.source === 'twitch'
    ? 'SONDAGE TWITCH · EN COURS'
    : next.source === 'demo'
      ? 'MODE APERÇU'
      : voteHint(next.a, next.b, next.c, next.d);

  if (next.mode === 'live') {
    if (next.startsAt) debateTotal = Math.max(2000, next.endsAt - next.startsAt);
    else if (prev === 'idle') debateTotal = Math.max(2000, next.endsAt - Date.now());
    if (prev === 'idle') {
      lastP.A = 0; lastP.B = 0; lastP.C = 0; lastP.D = 0;
      playSound('impact');
      clearTimeout(clockStartT);
      clockStartT = setTimeout(startClock, 250);
    }
    E.chip.classList.remove('is-result');
    E.chipTxt.textContent = 'DÉBAT EN DIRECT';
    ['A','B','C','D'].forEach(k=>{
      const o=E['opt'+k];
      if(o) o.classList.remove('is-winner','is-loser');
    });
    card.classList.add('is-live');
    render();
  }
  else if (next.mode === 'ended') {
    E.chip.classList.add('is-result');
    E.chipTxt.textContent = 'RÉSULTAT';
    E.timer.classList.add('is-off');
    lastP.A = lastP.B = lastP.C = lastP.D = null;
    clearTimeout(clockStartT); stopClock();
    E.timeFill.style.width = '0%';
    const va = next.va || 0, vb = next.vb || 0, vc = next.vc || 0, vd = next.vd || 0;
    const scores = [{k:'A',v:va},{k:'B',v:vb}];
    if (next.c) scores.push({k:'C',v:vc});
    if (next.d) scores.push({k:'D',v:vd});
    scores.sort((a,b)=>b.v-a.v);
    const w = next.winner || (scores[0]?.k || 'A');
    const winOpt = E['opt'+w];
    if (winOpt) winOpt.classList.add('is-winner');
    ['A','B','C','D'].forEach(k=>{
      if(k!==w){
        const o=E['opt'+k];
        if(o && !o.hidden) o.classList.add('is-loser');
      }
    });
    card.classList.add('is-live');
    render();
    playSound('victory');
    endTimer = setTimeout(beginExit, 5000);
  }
}

/* ═══════════════════════════════════════════════════════════════
   TRANSPORT — EventSource (SSE) + fallback polling 1,5 s
   ═══════════════════════════════════════════════════════════════ */
let lastMsg = 0, es = null, pollTimer = null;

function apply(m) {
  if (!m) return;
  lastMsg = Date.now();
  if (m.chat) { pushChat(m); return; }      // message du vrai chat (via le pont)
  if (m.badgeMap) { badgeMap = m.badgeMap; return; }   // vrais badges Twitch (images)
  if (m.pin) { m.pin === 0 ? clearPin() : setPin(m); return; }   // message épinglé
  if (m.mission) { queueMission(m); return; }   // V46 : echange de points de chaine
  if (m.sceneChange) { applySceneLayout(m.layout); return; }   // V47 : agencement par scene OBS
  if (m.velocityReset) { if (window.velocityReset) window.velocityReset(); return; }
  if (m.velocityValidate) { if (window.velocityValidate) window.velocityValidate(); return; }
  /* sub goal et/ou config (titre + accent + velocity) — le pont les envoie parfois
     ensemble : on applique les deux, sans retour prématuré */
  if (m.goal || m.cfg || m.velocity) {
    if (m.goal) setGoal(m);
    if (m.cfg || m.velocity) applyConfig(m);
    return;
  }
  if (m.mode) setState(m);
}

/* — Applique le titre du chat + la couleur d'accent + velocity config — */
function hexToRgb(hex){
  try{
    let h = String(hex||'').trim().replace('#','');
    if(h.length===3) h = h.split('').map(ch=>ch+ch).join('');
    const n = parseInt(h,16);
    if(isNaN(n)) return null;
    return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
  }catch(e){ return null; }
}
function darkenHex(hex, amt){
  const rgb = hexToRgb(hex);
  if(!rgb) return hex;
  const d = (v)=> Math.max(0, Math.min(255, Math.round(v*(1-amt))));
  const toHex = (v)=> v.toString(16).padStart(2,'0');
  return '#'+toHex(d(rgb.r))+toHex(d(rgb.g))+toHex(d(rgb.b));
}
function applyConfig(c) {
  if (c.chatTitle) { const t = document.getElementById('chatTitle'); if (t) t.textContent = c.chatTitle; }
  if (c.accent) {
    const accent = c.accent;
    const deep = darkenHex(accent, 0.35);
    const rgb = hexToRgb(accent);
    document.documentElement.style.setProperty('--violet', accent);
    document.documentElement.style.setProperty('--violet-deep', deep);
    if (rgb) {
      document.documentElement.style.setProperty('--violet-rgb', rgb.r+','+rgb.g+','+rgb.b);
      const light = 'color-mix(in srgb, '+accent+' 60%, white)';
      document.documentElement.style.setProperty('--violet-light', light);
    }
  }
  if (c.missionsEnabled !== undefined || c.missionDuration !== undefined || c.missionBottom !== undefined
      || c.missionWidth !== undefined || c.missionScale !== undefined
      || c.missionShowUser !== undefined || c.missionShowInput !== undefined) missionApplyConfig(c);
  if (c.velocity || c.equilibriumMPM !== undefined || c.velocityEnabled !== undefined || c.velocityAntiSpam !== undefined || c.antiSpam !== undefined || c.excludedUsers !== undefined || c.velocityExcludedUsers !== undefined) {
    if (window.velocityApplyConfig) window.velocityApplyConfig(c);
  }
}

/* ═══════════════════════════════════════════════════════════════
   CHAT — panneau gauche. En démo : messages fictifs.
   En live : messages du chat Twitch diffusés par le pont (SSE).
   ═══════════════════════════════════════════════════════════════ */
const chatPanel = $('chat'), chatList = $('chatList');
const chatPin = $('chatPin'), goalWrap = $('chatGoal');
const goalMain = $('goalMain');
const goalLabel = $('goalLabel'), goalCount = $('goalCount'), goalFill = $('goalFill');
const goalHistory = $('goalHistory'), goalNext = $('goalNext'), goalNextLabel = $('goalNextLabel'), goalNextCount = $('goalNextCount'), goalNextFill = $('goalNextFill');
const MAX_CHAT = 10;
let badgeMap = null;   // reçu du pont : { set_id: { version: url_4x } } (vrais badges)
/* couleurs vives et stables par pseudo (identité du spectateur) */
const CHAT_COLORS = ['#FFD166','#FF7B9C','#6BE585','#5EC8F2','#FF9F45','#C79BFF','#4EE3C4','#FF6B6B'];
function chatColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return CHAT_COLORS[Math.abs(h) % CHAT_COLORS.length];
}
/* — Badge Twitch : VRAIE image officielle (reçue du pont via badgeMap).
     Si l'image n'est pas encore chargée ou inconnue → chip texte en repli. — */
const BADGE_CHIP = { broadcaster: 'STREAMER', moderator: 'MOD', vip: 'VIP', staff: 'STAFF',
  admin: 'ADMIN', global_mod: 'GMOD', premium: 'PRIME', turbo: 'TURBO', bits: v => 'BITS ' + v,
  subscriber: v => 'SUB ' + (v || 1), 'sub-gifter': v => 'GIFT ' + v, founder: 'FOUNDER',
  premium_painter: 'PAINT', channel_team: 'TEAM', predictions: 'PRED' };
function makeBadge(id, version) {
  const v = String(version || '1');
  const url = badgeMap && badgeMap[id] && badgeMap[id][v];
  if (!url) {
    // pas de vraie image → chip texte (repli, en attendant le chargement des badges)
    const chip = document.createElement('span');
    chip.className = 'cchip' + (id === 'broadcaster' || id === 'vip' ? ' cchip--me' : id === 'moderator' ? ' cchip--mod' : '');
    chip.textContent = (typeof BADGE_CHIP[id] === 'function') ? BADGE_CHIP[id](v)
      : (BADGE_CHIP[id] || id.toUpperCase().slice(0, 5));
    return chip;
  }
  const img = document.createElement('img');
  img.className = 'cbadge';
  img.src = url;
  img.alt = id;
  return img;
}
/* — Texte du message : emotes/GIFs Twitch tokenisés + URLs .gif/.webp brutes — */
function appendMsg(cm, m) {
  const text = String(m.msg || '').slice(0, 200);
  let items = [];
  if (m.emotes) {
    let sets = {};
    try { sets = JSON.parse(m.emoteSets || '{}'); } catch (e) {}
    items = String(m.emotes).split('/').filter(Boolean).map(p => {
      const i = p.indexOf(':'); if (i < 0) return null;
      const id = p.slice(0, i);
      const rng = p.slice(i + 1).split('-').map(Number);
      if (!isFinite(rng[0]) || !isFinite(rng[1])) return null;
      return { id, s: rng[0], e: rng[1], animated: sets[id] === 1 || sets[id] === true };
    }).filter(Boolean).sort((a, b) => a.s - b.s);
  }
  let pos = 0;
  for (const it of items) {
    if (it.s < pos || it.e >= text.length) continue;
    if (it.s > pos) cm.appendChild(document.createTextNode(text.slice(pos, it.s)));
    const img = document.createElement('img');
    img.className = 'cemote';
    // Twitch a DEUX formats d'emotes :
    //   - ancien : IDs numériques (ex. 30251) → /emotes/v1/{id}/3.0
    //   - nouveau : IDs "emotesv2_..." → /emoticons/v2/{id}/default/dark/3.0
    img.src = String(it.id).startsWith('emotesv2_')
      ? 'https://static-cdn.jtvnw.net/emoticons/v2/' + it.id + '/default/dark/3.0'
      : 'https://static-cdn.jtvnw.net/emotes/v1/' + it.id + '/3.0';
    img.alt = text.slice(it.s, it.e + 1);
    img.onerror = () => { try { img.replaceWith(document.createTextNode(img.alt)); } catch (e) {} };
    cm.appendChild(img);
    pos = it.e + 1;
  }
  if (pos < text.length) {
    /* GIFs / WebP inline : URL externes ou locales (ex. démo) */
    const parts = text.slice(pos).split(/(https?:\/\/[^\s]+\.(?:gif|webp)(?:\?[^\s]*)?|demo\/[\w.-]+\.(?:gif|webp))/i);
    let n = 0;
    for (const part of parts) {
      if (!part) continue;
      if (/^(https?:\/\/[^\s]+\.(?:gif|webp)|demo\/[\w.-]+\.(?:gif|webp))/i.test(part) && n < 2) {
        const g = document.createElement('img');
        g.className = 'cemote'; g.src = part; g.alt = 'gif';
        g.onerror = () => { try { g.replaceWith(document.createTextNode('[gif]')); } catch (e) {} };
        cm.appendChild(g); n++;
      } else cm.appendChild(document.createTextNode(part));
    }
  }
}
/* — Ligne de message complète : [badges] [pseudo] [↪ réponse / texte] — */
function buildMsgRow(m, withPinIcon) {
  const role = m.role === 'me' ? 'me' : (m.role === 'mod' ? 'mod' : 'user');
  const d = document.createElement('div');
  d.className = 'cmsg' + (m.highlight ? ' is-hl' : '');
  if (withPinIcon) {
    const f = document.createElement('span'); f.className = 'cflag'; f.textContent = '📌';
    d.appendChild(f);
  }
  if (m.badges && typeof m.badges === 'object' && Object.keys(m.badges).length) {
    const bb = document.createElement('span'); bb.className = 'cbadges';
    for (const [id, v] of Object.entries(m.badges).slice(0, 4)) bb.appendChild(makeBadge(id, v));
    d.appendChild(bb);
  }
  const cn = document.createElement('span');
  cn.className = 'cn' + (role !== 'user' ? ' cn--' + role : '');
  cn.textContent = String(m.user || 'spectateur').slice(0, 24) + ':';   // « pseudo : » (deux-points)
  if (m.color) cn.style.color = m.color;                     // vraie couleur Twitch
  else if (role === 'user') cn.style.color = chatColor(cn.textContent);
  const cb = document.createElement('span'); cb.className = 'cbody';
  if (m.replyTo) {
    const r = document.createElement('span'); r.className = 'creply';
    r.textContent = '↪ ';
    const b = document.createElement('b'); b.textContent = '@' + String(m.replyTo).slice(0, 24);
    r.appendChild(b);
    cb.appendChild(r);
  }
  const ct = document.createElement('span'); ct.className = 'ctext';
  appendMsg(ct, m);
  cb.appendChild(ct);
  d.appendChild(cn); d.appendChild(cb);
  return d;
}
/* ═══ V47 — AGENCEMENT PAR SCENE OBS ═══════════════════════════════
   Quand tu changes de scene dans OBS, le pont nous envoie la disposition
   prevue pour cette scene. Chaque bloc est place en absolu ; un bloc absent
   de la disposition reprend sa position par defaut du CSS. */
const BLOCS_SEL = {
  chat:     '#chat',
  velocity: '#velocityWrap',
  mission:  '#mission',
  poll:     '#card'
};

/* Fondu au changement de scene : les blocs s'effacent, se replacent pendant
   qu'ils sont invisibles, puis reapparaissent. Evite de voir un bloc glisser
   d'un bout a l'autre de l'ecran. */
let sceneFadeT = null;
function applySceneLayout(layout) {
  const blocs = Object.values(BLOCS_SEL)
    .map(sel => document.querySelector(sel)).filter(Boolean);

  clearTimeout(sceneFadeT);
  blocs.forEach(el => el.classList.add('scene-fading'));

  // on replace pendant que c'est invisible, puis on refait apparaitre
  sceneFadeT = setTimeout(() => {
    placerBlocs(layout);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => blocs.forEach(el => el.classList.remove('scene-fading')));
    });
  }, 180);
}

function placerBlocs(layout) {
  for (const [cle, sel] of Object.entries(BLOCS_SEL)) {
    const el = document.querySelector(sel);
    if (!el) continue;
    const b = layout && layout[cle];

    if (!b) {
      /* pas de reglage pour ce bloc : on enleve tout ce qu'on avait pose
         pour que le CSS d'origine reprenne la main */
      el.style.removeProperty('left');   el.style.removeProperty('top');
      el.style.removeProperty('right');  el.style.removeProperty('bottom');
      el.style.removeProperty('display');
      if (cle === 'mission') el.style.removeProperty('margin');
      continue;
    }

    if (b.hidden) { el.style.display = 'none'; continue; }
    el.style.removeProperty('display');

    /* On passe en ancrage haut/gauche : c'est le seul moyen d'etre coherent
       quels que soient les reglages d'origine (certains blocs sont ancres a
       droite ou en bas dans le CSS). */
    el.style.left = b.x + 'px';
    el.style.top = b.y + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    /* On ne touche JAMAIS a la taille : chaque bloc garde exactement celle
       definie par ses propres reglages. L'agencement ne fait que DEPLACER. */
    if (cle === 'mission') el.style.margin = '0';   // annule le centrage automatique
  }
}

/* ═══ V46 — MISSIONS : bandeau du bas ═════════════════════════════
   Un viewer echange des points → le titre de la recompense s'affiche en bas
   pendant quelques secondes. File d'attente : deux echanges simultanes passent
   l'un apres l'autre, jamais superposes. Tout est pilote par le pont. */
const missionEl = $('mission');
const missionQueue = [];
let missionBusy = false, missionHideT = null, missionNextT = null, missionChronoT = null;
const MISSION_GAP = 420;        // ms de respiration entre deux bandeaux
let missionCfg = { enabled: true, duration: 8, showUser: true, showInput: true };

function missionApplyConfig(c) {
  if (c.missionsEnabled !== undefined) missionCfg.enabled = !(c.missionsEnabled === false || c.missionsEnabled === 'false' || c.missionsEnabled === 0);
  if (c.missionDuration !== undefined) missionCfg.duration = Math.max(3, Math.min(30, +c.missionDuration || 8));
  if (c.missionShowUser !== undefined) missionCfg.showUser = !(c.missionShowUser === false || c.missionShowUser === 'false' || c.missionShowUser === 0);
  if (c.missionShowInput !== undefined) missionCfg.showInput = !(c.missionShowInput === false || c.missionShowInput === 'false' || c.missionShowInput === 0);
  const root = document.documentElement.style;
  if (c.missionBottom !== undefined) root.setProperty('--mission-bottom', Math.max(0, Math.min(400, +c.missionBottom || 0)) + 'px');
  if (c.missionWidth !== undefined) root.setProperty('--mission-w', Math.max(600, Math.min(1600, +c.missionWidth || 1100)) + 'px');
  if (c.missionScale !== undefined) root.setProperty('--mission-scale', (Math.max(60, Math.min(140, +c.missionScale || 100)) / 100).toString());
  // coupe net si on desactive pendant qu'un bandeau est a l'ecran
  if (!missionCfg.enabled) {
    missionQueue.length = 0;
    clearTimeout(missionHideT); clearTimeout(missionNextT); clearInterval(missionChronoT);
    if (missionEl) missionEl.classList.remove('is-on');
    missionBusy = false;
  }
}

function queueMission(m) {
  if (!missionEl || !missionCfg.enabled) return;
  if (missionQueue.length >= 8) missionQueue.shift();   // en cas de deluge, on garde les plus recents
  missionQueue.push(m);
  if (!missionBusy) showNextMission();
}

function showNextMission() {
  if (!missionEl) return;
  const m = missionQueue.shift();
  if (!m) { missionBusy = false; return; }
  missionBusy = true;

  const title = String(m.title || '').trim();
  if (!title) { missionBusy = false; return showNextMission(); }
  $('missionTitle').textContent = title;
  // le titre est la mission : on adapte la taille pour qu'il tienne sans rogner
  missionEl.classList.toggle('is-long', title.length > 26 && title.length <= 46);
  missionEl.classList.toggle('is-xlong', title.length > 46);

  $('missionKicker').textContent = m.test ? 'MISSION · TEST' : 'MISSION';

  const sub = $('missionSub');
  const bits = [];
  if (missionCfg.showUser && m.user) bits.push('demandée par <span class="who">' + esc(m.user) + '</span>');
  if (missionCfg.showInput && m.input) bits.push('<span class="msg">« ' + esc(m.input) + ' »</span>');
  sub.innerHTML = bits.join(' · ');
  sub.style.display = bits.length ? '' : 'none';

  const cost = Math.max(0, Math.round(+m.cost || 0));
  const costEl = $('missionCost');
  costEl.classList.toggle('is-hidden', cost <= 0);
  if (cost > 0) $('missionCostVal').textContent = cost.toLocaleString('fr-FR');

  /* Duree : celle de la recompense si elle est personnalisee, sinon la duree
     generale du panneau. Une recompense personnalisee peut monter a 10 minutes
     (ex. « fais 10 pompes » avec un chrono d'une minute). */
  const dur = (m.duration != null)
    ? Math.max(3, Math.min(600, +m.duration || 8))
    : Math.max(3, Math.min(30, +missionCfg.duration || 8));

  /* Chrono : compte a rebours visible, uniquement si la recompense l'a active. */
  clearInterval(missionChronoT);
  const chronoEl = $('missionChrono'), chronoVal = $('missionChronoVal');
  missionEl.classList.toggle('has-chrono', !!m.chrono);
  if (m.chrono && chronoEl) {
    chronoEl.classList.remove('is-final');
    let reste = Math.ceil(dur);
    const peindre = () => {
      // au dessus d'une minute on affiche m:ss, sinon juste les secondes
      chronoVal.textContent = reste >= 60
        ? Math.floor(reste / 60) + ':' + String(reste % 60).padStart(2, '0')
        : String(reste);
      chronoEl.classList.toggle('is-final', reste <= 5);
    };
    peindre();
    missionChronoT = setInterval(() => {
      reste--;
      if (reste <= 0) { clearInterval(missionChronoT); reste = 0; }
      peindre();
    }, 1000);
  }
  missionEl.style.setProperty('--mission-dur', dur + 's');
  // relance l'animation de la barre de temps a chaque bandeau
  const tf = $('missionTimeFill');
  if (tf) { tf.style.animation = 'none'; void tf.offsetWidth; tf.style.animation = ''; }

  missionEl.classList.add('is-on');
  clearTimeout(missionHideT);
  missionHideT = setTimeout(() => {
    missionEl.classList.remove('is-on');
    clearInterval(missionChronoT);
    clearTimeout(missionNextT);
    missionNextT = setTimeout(showNextMission, MISSION_GAP);
  }, dur * 1000);
}

function pushChat(m) {
  chatList.appendChild(buildMsgRow(m));
  while (chatList.children.length > MAX_CHAT) chatList.removeChild(chatList.firstChild);
  chatPanel.classList.add('is-on');
  try { if (window.__velocityPush) window.__velocityPush(m); } catch(e) {}
}
/* — Message ÉPINGLÉ (haut du chat, apparaît / disparaît) — */
function setPin(m) {
  chatPin.replaceChildren(buildMsgRow(m, true));
  chatPin.classList.add('is-on');
}
function clearPin() { chatPin.classList.remove('is-on'); }
/* — SUB GOAL V31 : file d'attente complete, plus proche du nombre de subs, croissance vers le haut — */
function setGoal(g) {
  const cur = Math.max(0, Math.round(+g.current || 0));
  const tgt = Math.max(1, Math.round(+g.target || 1));
  const label = String(g.label || 'SUB GOAL').slice(0, 24).toUpperCase();
  const queue = Array.isArray(g.queue) ? g.queue.slice() : [];
  const upcoming = Array.isArray(g.upcoming) ? g.upcoming.slice() : (g.nextTarget ? [{label:g.nextLabel||label, target:g.nextTarget}] : []);
  const history = Array.isArray(g.history) ? g.history.slice() : [];

  // main = actuel = plus proche au dessus du nombre actuel (calcule serveur)
  if (goalLabel) goalLabel.textContent = label;
  if (goalCount) goalCount.textContent = cur + ' / ' + tgt;
  if (goalFill) goalFill.style.width = Math.min(100, (cur / tgt) * 100).toFixed(1) + '%';
  if (goalMain) goalMain.classList.toggle('is-done', cur >= tgt);

  // history : checked items au dessus, ordre petit→grand
  if (goalHistory) {
    goalHistory.innerHTML = '';
    const sorted = history.slice().sort((a,b)=> (a.target||0)-(b.target||0));
    // on limite affichage a 10 mais garde tout pour croissance
    const toShow = sorted.slice(-10);
    for (const h of toShow) {
      const div = document.createElement('div');
      div.className = 'goal__histItem';
      const chk = document.createElement('span'); chk.className='goal__check'; chk.textContent='✓';
      const lab = document.createElement('span'); lab.className='goal__histLabel'; lab.textContent = String(h.label||'SUB GOAL').slice(0,24).toUpperCase();
      const cnt = document.createElement('span'); cnt.className='goal__histCount'; cnt.textContent = (h.currentAtCompletion||h.target) + ' / ' + h.target;
      div.append(chk, lab, cnt);
      goalHistory.appendChild(div);
    }
  }

  // upcoming : tous les objectifs a venir en dessous, tries petit->grand
  if (goalNext) {
    // on reutilise goalNext comme conteneur pour liste multiple
    goalNext.innerHTML = '';
    const allUpcoming = upcoming.slice().sort((a,b)=>a.target-b.target);
    if (allUpcoming.length>0) {
      goalNext.hidden = false;
      // separateur
      const sep = document.createElement('div'); sep.className='goal__sep'; sep.innerHTML='<span></span>';
      goalNext.appendChild(sep);
      for (const up of allUpcoming) {
        const row = document.createElement('div');
        row.className='goal__nextItem';
        const top = document.createElement('div'); top.className='goal__top';
        const lab = document.createElement('span'); lab.className='goal__label goal__label--next'; lab.textContent = String(up.label||label).slice(0,24).toUpperCase() + ' — À VENIR';
        const cnt = document.createElement('span'); cnt.className='goal__count goal__count--next'; cnt.textContent = '0 / ' + up.target;
        top.append(lab,cnt);
        const bar = document.createElement('div'); bar.className='goal__bar goal__bar--next';
        const fill = document.createElement('div'); fill.className='goal__fill goal__fill--next'; fill.style.width='0%';
        bar.appendChild(fill);
        row.append(top,bar);
        goalNext.appendChild(row);
      }
    } else {
      // compat ancien nextLabel/nextTarget affichage si queue non presente
      const legacyNextTarget = g.nextTarget ? Math.max(0, Math.round(+g.nextTarget)) : 0;
      if (legacyNextTarget>0) {
        goalNext.hidden = false;
        const sep = document.createElement('div'); sep.className='goal__sep'; sep.innerHTML='<span></span>';
        const row = document.createElement('div'); row.className='goal__nextItem';
        const top = document.createElement('div'); top.className='goal__top';
        const lab = document.createElement('span'); lab.className='goal__label goal__label--next'; lab.id='goalNextLabel'; lab.textContent = (String(g.nextLabel||label).slice(0,24).toUpperCase()) + ' — À VENIR';
        const cnt = document.createElement('span'); cnt.className='goal__count goal__count--next'; cnt.id='goalNextCount'; cnt.textContent = '0 / ' + legacyNextTarget;
        top.append(lab,cnt);
        const bar = document.createElement('div'); bar.className='goal__bar goal__bar--next';
        const fill = document.createElement('div'); fill.className='goal__fill goal__fill--next'; fill.id='goalNextFill'; fill.style.width='0%';
        bar.appendChild(fill);
        row.append(top,bar);
        goalNext.append(sep,row);
      } else {
        goalNext.hidden = true;
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   VÉLOCITÉ CHAT V5 — % gros + fin prévue fonctionnelle + chrono auto +15min
   - Plus long (700px), pas de croix, pas de FAITES GRIMPER, pas de hint
   - Simple : barre + % + info (90% → +15 MIN) + chrono verrou + fin prévue blanc ombré
   - Quand fin désactivée, barre s'allonge (flex)
   - Logique : seuil % + durée ajout (min) + chrono verrou (sec au dessus seuil → +durée à fin)
   - Leaky bucket sans rebond, rouge 5 derniers %
   ═══════════════════════════════════════════════════════════════ */
(() => {
  const wrap = document.getElementById('velocityWrap');
  const fill = document.getElementById('velocityFill');
  const glow = document.getElementById('velocityGlow');
  const mpmEl = document.getElementById('velocityMpm');
  const pctEl = document.getElementById('velocityPct');
  const goalEl = document.getElementById('velocityGoal');
  const chronoEl = document.getElementById('velocityChrono');
  const boostEl = document.getElementById('velocityBoost');
  const finEl = document.getElementById('velocityFin');
  if (!wrap || !fill) return;

  let cfg = {
    equilibriumMPM: 20,
    climbSensitivity: 0.65,
    decayRate: 0.14,
    barWidth: 30,
    barHeight: 700,
    showMetrics: true,
    velocityEnabled: true,
    goalThreshold: 90,
    goalDurationMinutes: 15,
    holdDurationSeconds: 120,
    boostMult: 1,
    finHour: 21,
    finMinute: 30,
    finEnabled: true,
    antiSpam: true,
    cooldownSeconds: 15,
    maxPerMinute: 2,
    excludedUsers: []
  };
  const userHits = new Map(); // user -> { last, times[] }

  let velocity = 0;
  let displayed = 0;
  let mpmScore = 0;
  let lastFrame = performance.now();
  let held = 0;            // secondes « tenues » au-dessus du seuil (déjà multipliées)
  let aboveStart = 0;      // compat : instant où le seuil a été franchi
  let isOverdrive = false;
  let excludedCache = null;

  function applyVisualConfig() {
    wrap.style.setProperty('--vel-w', cfg.barWidth + 'px');
    wrap.style.setProperty('--vel-h', cfg.barHeight + 'px');
    wrap.classList.toggle('no-metrics', !cfg.showMetrics);
    // toggle visible : is-on = visible
    if (cfg.velocityEnabled === false) {
      wrap.classList.remove('is-on');
      wrap.setAttribute('aria-hidden','true');
    } else {
      wrap.classList.add('is-on');
      wrap.setAttribute('aria-hidden','false');
    }

    // objectif simple : seuil → +durée (+ rappel du turbo armé, qui ne s'affiche qu'à 100 %)
    if (goalEl) {
      goalEl.textContent = cfg.goalThreshold + '% → +' + cfg.goalDurationMinutes + ' MIN';
    }
    if (boostEl) boostEl.textContent = fmtMult(cfg.boostMult);   // texte pré-remplié ; il ne s'AFFICHE qu'à 100 %

    // fin prévue fonctionnelle
    if (finEl) {
      if (cfg.finEnabled) {
        const hh = String(cfg.finHour).padStart(2,'0');
        const mm = String(cfg.finMinute).padStart(2,'0');
        finEl.textContent = 'FIN PRÉVUE : ' + hh + 'H' + mm;
        finEl.style.display = '';
      } else {
        finEl.style.display = 'none';
      }
    }

    // chrono caché par défaut (sera affiché quand >= seuil)
    if (chronoEl && !wrap.classList.contains('is-goal')) {
      chronoEl.classList.remove('is-on');
    }
  }

  function fmtMult(n) {
    const v = Math.round(n * 100) / 100;
    return '×' + String(v).replace('.', ',');   // ×1,25 à la française
  }
  function parseExcluded(v) {
    const raw = Array.isArray(v) ? v.join(',') : String(v == null ? '' : v);
    const list = raw.split(/[,;\s]+/).map(s => s.toLowerCase().trim()).filter(Boolean);
    return list;
  }
  function excludedList() {
    if (!excludedCache) excludedCache = parseExcluded(cfg.excludedUsers);
    return excludedCache;
  }
  function shouldCountVelocity(m) {
    if (!cfg.antiSpam) return true;
    if (!m) return false;
    const text = String(m.msg || '').trim();
    if (!text) return false;
    if (text.startsWith('!')) return false;
    const user = String(m.user || '').toLowerCase().slice(0, 64);
    if (!user) return false;
    const excluded = excludedList();
    if (excluded.includes(user)) return false;
    // regle figee : le streamer et les mods comptent comme tout le monde (aucune exemption)
    const now = Date.now();
    let rec = userHits.get(user);
    if (!rec) rec = { last: 0, times: [] };
    rec.times = rec.times.filter(t => now - t < 60000);
    const cooldownMs = Math.max(0, (cfg.cooldownSeconds || 0) * 1000);
    if (cooldownMs > 0 && rec.last && (now - rec.last) < cooldownMs) return false;
    const maxN = Math.max(1, cfg.maxPerMinute || 2);
    if (rec.times.length >= maxN) return false;
    rec.last = now;
    rec.times.push(now);
    userHits.set(user, rec);
    return true;
  }
  function pushTimestamp(m) {
    if (!cfg.velocityEnabled) return;   // barre cachee = rien ne s'accumule pour rien
    if (!shouldCountVelocity(m)) return;
    mpmScore += 1;
  }
  window.__velocityPush = pushTimestamp;

  function resetVelocity(full) {
    if (full) { mpmScore = 0; userHits.clear(); }
    velocity = 0; displayed = 0; aboveStart = 0; held = 0; isOverdrive = false;
    wrap.classList.remove('is-overdrive','is-hot','is-goal','is-boost');
    if (boostEl) boostEl.classList.remove('is-on');
    if (fill) fill.style.height = '0%';
    if (glow) { glow.style.bottom='0%'; glow.style.opacity='0'; }
    if (pctEl) pctEl.textContent='0%';
    if (mpmEl) mpmEl.textContent='0 MPM';
    if (chronoEl) chronoEl.classList.remove('is-on');
  }

  function addMinutesToFin(mins) {
    let total = cfg.finHour*60 + cfg.finMinute + mins;
    total = ((total % 1440) + 1440) % 1440;
    cfg.finHour = Math.floor(total/60);
    cfg.finMinute = total % 60;
    if (finEl && cfg.finEnabled) {
      const hh = String(cfg.finHour).padStart(2,'0');
      const mm = String(cfg.finMinute).padStart(2,'0');
      finEl.textContent = 'FIN PRÉVUE : ' + hh + 'H' + mm;
    }
    // persist
    fetch('api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({velocityFinHour:cfg.finHour, velocityFinMinute:cfg.finMinute})}).catch(()=>{});
  }

  function triggerGoal() {
    // +durée à fin prévue
    addMinutesToFin(cfg.goalDurationMinutes);
    // nouveau tour sans toucher MPM
    resetVelocity(false);
    wrap.classList.add('is-overdrive');
    setTimeout(()=>wrap.classList.remove('is-overdrive'), 800);
  }

  window.velocityReset = () => { resetVelocity(true); };
  window.velocityValidate = () => { resetVelocity(false); };

  function toNum(v, def) {
    if (v === undefined || v === null || v === '') return def;
    const n = Number(v);
    return isFinite(n) ? n : def;
  }
  window.velocityApplyConfig = (c) => {
    const src = c.config || c;
    if (src.equilibriumMPM !== undefined) cfg.equilibriumMPM = Math.max(1, Math.round(toNum(src.equilibriumMPM, 20)));
    if (src.climbSensitivity !== undefined) cfg.climbSensitivity = Math.max(0.05, toNum(src.climbSensitivity, 0.65));
    if (src.decayRate !== undefined) cfg.decayRate = Math.max(0.02, toNum(src.decayRate, 0.14));
    if (src.barWidth !== undefined) cfg.barWidth = Math.max(12, Math.min(40, Math.round(toNum(src.barWidth, 30))));
    if (src.barHeight !== undefined) cfg.barHeight = Math.max(280, Math.min(900, Math.round(toNum(src.barHeight, 700))));
    if (src.showMetrics !== undefined) cfg.showMetrics = !!src.showMetrics;
    if (src.velocityEnabled !== undefined) cfg.velocityEnabled = !!src.velocityEnabled;
    if (src.goalThreshold !== undefined) cfg.goalThreshold = Math.max(10, Math.min(99, Math.round(toNum(src.goalThreshold, 90))));
    if (src.velocityGoalThreshold !== undefined) cfg.goalThreshold = Math.max(10, Math.min(99, Math.round(toNum(src.velocityGoalThreshold, 90))));
    if (src.goalDurationMinutes !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.goalDurationMinutes, 15))));
    if (src.velocityGoalDurationMinutes !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.velocityGoalDurationMinutes, 15))));
    if (src.goalDuration !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.goalDuration, 15))));
    if (src.velocityGoalDuration !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.velocityGoalDuration, 15))));
    if (src.holdDurationSeconds !== undefined) cfg.holdDurationSeconds = Math.max(5, Math.min(600, Math.round(toNum(src.holdDurationSeconds, 120))));
    if (src.velocityHold !== undefined) cfg.holdDurationSeconds = Math.max(5, Math.min(600, Math.round(toNum(src.velocityHold, 120))));
    if (src.velocityBoostMult !== undefined || src.boostMult !== undefined) {
      const bm = Number(src.velocityBoostMult !== undefined ? src.velocityBoostMult : src.boostMult);
      cfg.boostMult = isFinite(bm) ? Math.max(1, Math.min(2, Math.round(bm * 4) / 4)) : 1;
    }
    if (src.excludedUsers !== undefined || src.velocityExcludedUsers !== undefined) excludedCache = null;   // V43 : le cache des exclus est invalide
    if (src.finHour !== undefined) cfg.finHour = Math.max(0, Math.min(23, Math.round(toNum(src.finHour, 21))));
    if (src.velocityFinHour !== undefined) cfg.finHour = Math.max(0, Math.min(23, Math.round(toNum(src.velocityFinHour, 21))));
    if (src.finMinute !== undefined) cfg.finMinute = Math.max(0, Math.min(59, Math.round(toNum(src.finMinute, 30))));
    if (src.velocityFinMinute !== undefined) cfg.finMinute = Math.max(0, Math.min(59, Math.round(toNum(src.velocityFinMinute, 30))));
    if (src.finEnabled !== undefined) cfg.finEnabled = !!src.finEnabled;
    if (src.velocityFinEnabled !== undefined) cfg.finEnabled = !!src.velocityFinEnabled;
    // compat anciennes
    if (src.velocityEquilibrium !== undefined) cfg.equilibriumMPM = Math.max(1, Math.round(toNum(src.velocityEquilibrium, 20)));
    if (src.velocityClimb !== undefined) cfg.climbSensitivity = Math.max(0.05, toNum(src.velocityClimb, 0.65));
    if (src.velocityDecay !== undefined) cfg.decayRate = Math.max(0.02, toNum(src.velocityDecay, 0.14));
    if (src.velocityBarWidth !== undefined) cfg.barWidth = Math.max(12, Math.min(40, Math.round(toNum(src.velocityBarWidth, 30))));
    if (src.velocityBarHeight !== undefined) cfg.barHeight = Math.max(280, Math.min(900, Math.round(toNum(src.velocityBarHeight, 700))));
    if (src.velocityShowMetrics !== undefined) cfg.showMetrics = !!src.velocityShowMetrics;
    if (src.antiSpam !== undefined) cfg.antiSpam = !!src.antiSpam;
    if (src.velocityAntiSpam !== undefined) cfg.antiSpam = !!src.velocityAntiSpam;
    if (src.cooldownSeconds !== undefined) cfg.cooldownSeconds = Math.max(0, Math.min(120, Math.round(toNum(src.cooldownSeconds, 15))));
    if (src.velocityCooldownSeconds !== undefined) cfg.cooldownSeconds = Math.max(0, Math.min(120, Math.round(toNum(src.velocityCooldownSeconds, 15))));
    if (src.maxPerMinute !== undefined) cfg.maxPerMinute = Math.max(1, Math.min(30, Math.round(toNum(src.maxPerMinute, 2))));
    if (src.velocityMaxPerMinute !== undefined) cfg.maxPerMinute = Math.max(1, Math.min(30, Math.round(toNum(src.velocityMaxPerMinute, 2))));
    if (src.excludedUsers !== undefined) cfg.excludedUsers = parseExcluded(src.excludedUsers);
    if (src.velocityExcludedUsers !== undefined) cfg.excludedUsers = parseExcluded(src.velocityExcludedUsers);
    excludedCache = null;
    // debug
    try { console.log('[velocite] config appliquee', cfg); } catch(e){}
    applyVisualConfig();
  };

  fetch('api/config').then(r=>r.json()).then(d=>{ if(d && d.config) window.velocityApplyConfig(d.config); }).catch(()=>{});
  applyVisualConfig();

  function computeTarget(mpm) {
    const eq = cfg.equilibriumMPM;
    if (mpm <= 0) return 0;
    if (mpm <= eq) return (mpm/eq)*50;
    const over = (mpm - eq)/eq;
    const curved = Math.pow(over, 0.66);
    return 50 + 50*Math.min(1, curved*0.86);
  }

  function frame(now) {
    const dt = Math.min(0.12, (now - lastFrame)/1000);
    lastFrame = now;
    if (!cfg.velocityEnabled) { requestAnimationFrame(frame); return; }

    const tau = 42;
    mpmScore *= Math.exp(-dt / tau);
    if (mpmScore < 0.001) mpmScore = 0;

    const target = computeTarget(mpmScore);

    if (target > velocity) velocity += (target - velocity) * cfg.climbSensitivity * dt * 1.15;
    else velocity += (target - velocity) * cfg.decayRate * dt * 0.38;
    velocity = Math.max(0, Math.min(100, velocity));

    const lerp = 0.075 + Math.min(0.10, Math.abs(velocity-displayed)*0.0035);
    displayed += (velocity-displayed)*lerp;
    displayed = Math.max(0, Math.min(100, displayed));

    let vis = displayed;
    if (mpmScore > 0.6 && vis < 10) vis = 10;
    if (mpmScore > 1.5 && vis < 16) vis = 16;
    if (vis > 99.5) vis = 100;   // V43 : la barre parait pleine dès que le % affiché est 100

    fill.style.height = vis.toFixed(2)+'%';
    if (glow) {
      glow.style.bottom = vis.toFixed(2)+'%';
      glow.style.opacity = vis>6 ? String(Math.min(1, vis/42)) : '0';
    }

    if (pctEl) {
      const pct = Math.round(displayed);
      const prev = pctEl.textContent;
      pctEl.textContent = pct+'%';
      if (prev !== pct+'%' && pct>0) {
        pctEl.classList.remove('is-pop');
        void pctEl.offsetWidth;
        pctEl.classList.add('is-pop');
        setTimeout(()=>pctEl.classList.remove('is-pop'), 260);
      }
    }
    if (mpmEl) mpmEl.textContent = Math.round(mpmScore)+' MPM';

    /* chrono verrou au dessus du seuil.
       V43 : a 100 % de barre, le temps s'ecoule xN fois plus vite (multiplicateur choisi dans
       le panneau, x1 a x2 par pas de 0,25). Le cumul se fait par petits pas (held) plutot qu'en
       mesurant le temps ecoule : des qu'on repasse sous 100 %, le chrono retrouve sa vitesse
       normale SANS repartir de zero. Le badge xN n'apparait qu'a 100 % : pas d'indicateur en
       vitesse normale, comme demande. */
    const th = cfg.goalThreshold;
    const at100 = Math.round(displayed) >= 100;
    const boosting = at100 && cfg.boostMult > 1;
    if (displayed >= th) {
      if (!aboveStart) aboveStart = now;
      held += dt * (boosting ? cfg.boostMult : 1);
      const remain = Math.max(0, cfg.holdDurationSeconds - held);
      if (chronoEl) {
        const mm = String(Math.floor(remain/60)).padStart(2,'0');
        const ss = String(Math.floor(remain%60)).padStart(2,'0');
        chronoEl.textContent = mm + ':' + ss;
        chronoEl.classList.add('is-on');
      }
      wrap.classList.add('is-goal','is-hot');
      if (boostEl) boostEl.classList.toggle('is-on', boosting);
      wrap.classList.toggle('is-boost', boosting);
      if (held >= cfg.holdDurationSeconds && !isOverdrive) {
        isOverdrive = true;
        triggerGoal();
        setTimeout(()=>{ isOverdrive=false; }, 1000);
      }
    } else {
      aboveStart = 0; held = 0;
      if (chronoEl) chronoEl.classList.remove('is-on');
      if (boostEl) boostEl.classList.remove('is-on');
      wrap.classList.remove('is-goal','is-boost');
      wrap.classList.toggle('is-hot', displayed >= Math.max(60, th - 12));
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

async function pollState() {
  try {
    const r = await fetch(API + '/api/state', { cache: 'no-store' });
    apply(await r.json());
  } catch (e) { /* hors-ligne : on réessaie au prochain tick */ }
}

function connect() {
  if (q.get('poll') === '1') {            // mode distant (ex. Vercel) : polling 1 s, pas de SSE
    pollTimer = setInterval(pollState, 1000);
    pollState();
    return;
  }
  try {
    es = new EventSource(API + '/events');
    es.onmessage = e => { try { apply(JSON.parse(e.data)); } catch (err) {} };
    es.onopen = () => { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } };
    es.onerror = () => { if (!pollTimer) { pollTimer = setInterval(pollState, 1500); pollState(); } };
  } catch (e) {
    pollTimer = setInterval(pollState, 1500);
  }
  /* garde-fou : si le flux se coupe pendant un débat, on re-synchro */
  setInterval(() => { if (mode !== 'idle' && Date.now() - lastMsg > 7000) pollState(); }, 3000);
}

function vote(choice, user) {
  fetch(API + '/api/vote', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ choice, user: user || 'viewer-' + Math.random().toString(36).slice(2, 8) })
  }).catch(() => {});
}

/* ═══════════════════════════════════════════════════════════════
   MODE DÉMO — simulation autonome (aucun serveur requis)
   ═══════════════════════════════════════════════════════════════ */
const DEMO_DEBATES = [
  { q: 'Le format court a-t-il tué la culture générale ?', a: "Oui, la profondeur s'accélère", b: "Non, l'accès s'élargit", t: 40 },
  { q: 'Un débat sans conclusion est-il vain ?', a: 'Oui, tout doit trancher', b: "Non, l'essentiel est de confronter", t: 36 },
  { q: 'Le live est-il devenu un média d\u2019opinion ?', a: 'Oui, il oriente les foules', b: 'Non, il fait exister les voix', t: 42 }
];
let demoIdx = 0, demoVotes = null, demoTimer = null, demoEndTimer = null;

function demoStart() {
  const d = DEMO_DEBATES[demoIdx % DEMO_DEBATES.length]; demoIdx++;
  demoVotes = { A: 0, B: 0, C: 0, D: 0, bias: Math.random() < .5 ? 1.07 : .93 };
  const d0 = Date.now();
  const hasCD = !!(d.c || d.d);
  setState({ mode: 'live', question: d.q, a: d.a, b: d.b, c: d.c, d: d.d, va: 0, vb: 0, vc: 0, vd: 0,
             startsAt: d0, endsAt: d0 + d.t * 1000, source: 'demo' });
  demoTimer = setInterval(() => {
    if (!demoVotes || !cur) return;
    let n = Math.random() < .6 ? 1 + (Math.random() * 3 | 0) : 0;
    while (n--) {
      const r=Math.random();
      if (hasCD) {
        if (r<0.3) demoVotes.A++; else if (r<0.6) demoVotes.B++; else if (r<0.8) demoVotes.C++; else demoVotes.D++;
      } else {
        (Math.random() < demoVotes.bias ? demoVotes.A++ : demoVotes.B++);
      }
    }
    setState({ mode: 'live', question: cur.question, a: cur.a, b: cur.b, c: cur.c, d: cur.d,
               startsAt: cur.startsAt, va: demoVotes.A, vb: demoVotes.B, vc: demoVotes.C, vd: demoVotes.D, endsAt: cur.endsAt, source: 'demo' });
  }, 520);
  demoEndTimer = setTimeout(demoEnd, d.t * 1000);
}
function demoEnd() {
  if (!cur) return;
  clearInterval(demoTimer);
  const scores=[{k:'A',v:demoVotes.A},{k:'B',v:demoVotes.B},{k:'C',v:demoVotes.C},{k:'D',v:demoVotes.D}].filter(s=>cur[s.k.toLowerCase()]||s.k==='A'||s.k==='B');
  scores.sort((a,b)=>b.v-a.v);
  const w = scores[0]?.k || 'A';
  setState({ mode: 'ended', question: cur.question, a: cur.a, b: cur.b, c: cur.c, d: cur.d,
             startsAt: cur.startsAt, va: demoVotes.A, vb: demoVotes.B, vc: demoVotes.C, vd: demoVotes.D, endsAt: Date.now(), winner: w, source: 'demo' });
  demoVotes = null;
  if (LOOP) setTimeout(demoStart, 9000);
}

/* — Vote par clic (aperçu uniquement) — */
function clickVote(choice) {
  if (mode !== 'live') return;
  if (DEMO && demoVotes) {
    demoVotes[choice]++;
    setState({ mode: 'live', question: cur.question, a: cur.a, b: cur.b, c: cur.c, d: cur.d,
               startsAt: cur.startsAt, va: demoVotes.A, vb: demoVotes.B, vc: demoVotes.C, vd: demoVotes.D, endsAt: cur.endsAt, source: 'demo' });
  } else vote(choice);
}
E.optA.addEventListener('click', () => clickVote('A'));
E.optB.addEventListener('click', () => clickVote('B'));
if (E.optC) E.optC.addEventListener('click', () => clickVote('C'));
if (E.optD) E.optD.addEventListener('click', () => clickVote('D'));

  fetch('api/config').then(r => r.json()).then(d => { if (d && d.config) applyConfig(d.config); }).catch(() => {});
}
