    if (!rec) rec = { last: 0, times: [] };
    rec.times = rec.times.filter(t => now - t < 60000);
    const cooldownMs = Math.max(0, (cfg.cooldownSeconds || 0) * 1000);
    if (cooldownMs > 0 && rec.last && (now - rec.last) < cooldownMs) return false;
    const maxN = Math.max(1, cfg.maxPerMinute || 2);
    if (rec.times.length >= maxN) return false;
    rec.last = now;
    rec.times.push(now);
    userHits.set(user, rec);
    return true;
  }
  function pushTimestamp(m) {
    if (!cfg.velocityEnabled) return;   // barre cachee = rien ne s'accumule pour rien
    if (!shouldCountVelocity(m)) return;
    mpmScore += 1;
  }
  window.__velocityPush = pushTimestamp;

  function resetVelocity(full) {
    if (full) { mpmScore = 0; userHits.clear(); }
    velocity = 0; displayed = 0; aboveStart = 0; held = 0; isOverdrive = false;
    wrap.classList.remove('is-overdrive','is-hot','is-goal','is-boost');
    if (boostEl) boostEl.classList.remove('is-on');
    if (fill) fill.style.height = '0%';
    if (glow) { glow.style.bottom='0%'; glow.style.opacity='0'; }
    if (pctEl) pctEl.textContent='0%';
    if (mpmEl) mpmEl.textContent='0 MPM';
    if (chronoEl) chronoEl.classList.remove('is-on');
  }

  function addMinutesToFin(mins) {
    let total = cfg.finHour*60 + cfg.finMinute + mins;
    total = ((total % 1440) + 1440) % 1440;
    cfg.finHour = Math.floor(total/60);
    cfg.finMinute = total % 60;
    if (finEl && cfg.finEnabled) {
      const hh = String(cfg.finHour).padStart(2,'0');
      const mm = String(cfg.finMinute).padStart(2,'0');
      finEl.textContent = 'FIN PRÉVUE : ' + hh + 'H' + mm;
    }
    // persist
    fetch('api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({velocityFinHour:cfg.finHour, velocityFinMinute:cfg.finMinute})}).catch(()=>{});
  }

  function triggerGoal() {
    // +durée à fin prévue
    addMinutesToFin(cfg.goalDurationMinutes);
    // nouveau tour sans toucher MPM
    resetVelocity(false);
    wrap.classList.add('is-overdrive');
    setTimeout(()=>wrap.classList.remove('is-overdrive'), 800);
  }

  window.velocityReset = () => { resetVelocity(true); };
  window.velocityValidate = () => { resetVelocity(false); };

  function toNum(v, def) {
    if (v === undefined || v === null || v === '') return def;
    const n = Number(v);
    return isFinite(n) ? n : def;
  }
  window.velocityApplyConfig = (c) => {
    const src = c.config || c;
    if (src.equilibriumMPM !== undefined) cfg.equilibriumMPM = Math.max(1, Math.round(toNum(src.equilibriumMPM, 20)));
    if (src.climbSensitivity !== undefined) cfg.climbSensitivity = Math.max(0.05, toNum(src.climbSensitivity, 0.65));
    if (src.decayRate !== undefined) cfg.decayRate = Math.max(0.02, toNum(src.decayRate, 0.14));
    if (src.barWidth !== undefined) cfg.barWidth = Math.max(12, Math.min(40, Math.round(toNum(src.barWidth, 30))));
    if (src.barHeight !== undefined) cfg.barHeight = Math.max(280, Math.min(900, Math.round(toNum(src.barHeight, 700))));
    if (src.showMetrics !== undefined) cfg.showMetrics = !!src.showMetrics;
    if (src.velocityEnabled !== undefined) cfg.velocityEnabled = !!src.velocityEnabled;
    if (src.goalThreshold !== undefined) cfg.goalThreshold = Math.max(10, Math.min(99, Math.round(toNum(src.goalThreshold, 90))));
    if (src.velocityGoalThreshold !== undefined) cfg.goalThreshold = Math.max(10, Math.min(99, Math.round(toNum(src.velocityGoalThreshold, 90))));
    if (src.goalDurationMinutes !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.goalDurationMinutes, 15))));
    if (src.velocityGoalDurationMinutes !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.velocityGoalDurationMinutes, 15))));
    if (src.goalDuration !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.goalDuration, 15))));
    if (src.velocityGoalDuration !== undefined) cfg.goalDurationMinutes = Math.max(1, Math.min(120, Math.round(toNum(src.velocityGoalDuration, 15))));
    if (src.holdDurationSeconds !== undefined) cfg.holdDurationSeconds = Math.max(5, Math.min(600, Math.round(toNum(src.holdDurationSeconds, 120))));
    if (src.velocityHold !== undefined) cfg.holdDurationSeconds = Math.max(5, Math.min(600, Math.round(toNum(src.velocityHold, 120))));
    if (src.velocityBoostMult !== undefined || src.boostMult !== undefined) {
      const bm = Number(src.velocityBoostMult !== undefined ? src.velocityBoostMult : src.boostMult);
      cfg.boostMult = isFinite(bm) ? Math.max(1, Math.min(2, Math.round(bm * 4) / 4)) : 1;
    }
    if (src.excludedUsers !== undefined || src.velocityExcludedUsers !== undefined) excludedCache = null;   // V43 : le cache des exclus est invalide
    if (src.finHour !== undefined) cfg.finHour = Math.max(0, Math.min(23, Math.round(toNum(src.finHour, 21))));
    if (src.velocityFinHour !== undefined) cfg.finHour = Math.max(0, Math.min(23, Math.round(toNum(src.velocityFinHour, 21))));
    if (src.finMinute !== undefined) cfg.finMinute = Math.max(0, Math.min(59, Math.round(toNum(src.finMinute, 30))));
    if (src.velocityFinMinute !== undefined) cfg.finMinute = Math.max(0, Math.min(59, Math.round(toNum(src.velocityFinMinute, 30))));
    if (src.finEnabled !== undefined) cfg.finEnabled = !!src.finEnabled;
    if (src.velocityFinEnabled !== undefined) cfg.finEnabled = !!src.velocityFinEnabled;
    // compat anciennes
    if (src.velocityEquilibrium !== undefined) cfg.equilibriumMPM = Math.max(1, Math.round(toNum(src.velocityEquilibrium, 20)));
    if (src.velocityClimb !== undefined) cfg.climbSensitivity = Math.max(0.05, toNum(src.velocityClimb, 0.65));
    if (src.velocityDecay !== undefined) cfg.decayRate = Math.max(0.02, toNum(src.velocityDecay, 0.14));
    if (src.velocityBarWidth !== undefined) cfg.barWidth = Math.max(12, Math.min(40, Math.round(toNum(src.velocityBarWidth, 30))));
    if (src.velocityBarHeight !== undefined) cfg.barHeight = Math.max(280, Math.min(900, Math.round(toNum(src.velocityBarHeight, 700))));
    if (src.velocityShowMetrics !== undefined) cfg.showMetrics = !!src.velocityShowMetrics;
    if (src.antiSpam !== undefined) cfg.antiSpam = !!src.antiSpam;
    if (src.velocityAntiSpam !== undefined) cfg.antiSpam = !!src.velocityAntiSpam;
    if (src.cooldownSeconds !== undefined) cfg.cooldownSeconds = Math.max(0, Math.min(120, Math.round(toNum(src.cooldownSeconds, 15))));
    if (src.velocityCooldownSeconds !== undefined) cfg.cooldownSeconds = Math.max(0, Math.min(120, Math.round(toNum(src.velocityCooldownSeconds, 15))));
    if (src.maxPerMinute !== undefined) cfg.maxPerMinute = Math.max(1, Math.min(30, Math.round(toNum(src.maxPerMinute, 2))));
    if (src.velocityMaxPerMinute !== undefined) cfg.maxPerMinute = Math.max(1, Math.min(30, Math.round(toNum(src.velocityMaxPerMinute, 2))));
    if (src.excludedUsers !== undefined) cfg.excludedUsers = parseExcluded(src.excludedUsers);
    if (src.velocityExcludedUsers !== undefined) cfg.excludedUsers = parseExcluded(src.velocityExcludedUsers);
    excludedCache = null;
    // debug
    try { console.log('[velocite] config appliquee', cfg); } catch(e){}
    applyVisualConfig();
  };

  fetch('api/config').then(r=>r.json()).then(d=>{ if(d && d.config) window.velocityApplyConfig(d.config); }).catch(()=>{});
  applyVisualConfig();

  function computeTarget(mpm) {
    const eq = cfg.equilibriumMPM;
    if (mpm <= 0) return 0;
    if (mpm <= eq) return (mpm/eq)*50;
    const over = (mpm - eq)/eq;
    const curved = Math.pow(over, 0.66);
    return 50 + 50*Math.min(1, curved*0.86);
  }

  function frame(now) {
    const dt = Math.min(0.12, (now - lastFrame)/1000);
    lastFrame = now;
    if (!cfg.velocityEnabled) { requestAnimationFrame(frame); return; }

    const tau = 42;
    mpmScore *= Math.exp(-dt / tau);
    if (mpmScore < 0.001) mpmScore = 0;

    const target = computeTarget(mpmScore);

    if (target > velocity) velocity += (target - velocity) * cfg.climbSensitivity * dt * 1.15;
    else velocity += (target - velocity) * cfg.decayRate * dt * 0.38;
    velocity = Math.max(0, Math.min(100, velocity));

    const lerp = 0.075 + Math.min(0.10, Math.abs(velocity-displayed)*0.0035);
    displayed += (velocity-displayed)*lerp;
    displayed = Math.max(0, Math.min(100, displayed));

    let vis = displayed;
    if (mpmScore > 0.6 && vis < 10) vis = 10;
    if (mpmScore > 1.5 && vis < 16) vis = 16;
    if (vis > 99.5) vis = 100;   // V43 : la barre parait pleine dès que le % affiché est 100

    fill.style.height = vis.toFixed(2)+'%';
    if (glow) {
      glow.style.bottom = vis.toFixed(2)+'%';
      glow.style.opacity = vis>6 ? String(Math.min(1, vis/42)) : '0';
    }

    if (pctEl) {
      const pct = Math.round(displayed);
      const prev = pctEl.textContent;
      pctEl.textContent = pct+'%';
      if (prev !== pct+'%' && pct>0) {
        pctEl.classList.remove('is-pop');
        void pctEl.offsetWidth;
        pctEl.classList.add('is-pop');
        setTimeout(()=>pctEl.classList.remove('is-pop'), 260);
      }
    }
    if (mpmEl) mpmEl.textContent = Math.round(mpmScore)+' MPM';

    /* chrono verrou au dessus du seuil.
       V43 : a 100 % de barre, le temps s'ecoule xN fois plus vite (multiplicateur choisi dans
       le panneau, x1 a x2 par pas de 0,25). Le cumul se fait par petits pas (held) plutot qu'en
       mesurant le temps ecoule : des qu'on repasse sous 100 %, le chrono retrouve sa vitesse
       normale SANS repartir de zero. Le badge xN n'apparait qu'a 100 % : pas d'indicateur en
       vitesse normale, comme demande. */
    const th = cfg.goalThreshold;
    const at100 = Math.round(displayed) >= 100;
    const boosting = at100 && cfg.boostMult > 1;
    if (displayed >= th) {
      if (!aboveStart) aboveStart = now;
      held += dt * (boosting ? cfg.boostMult : 1);
      const remain = Math.max(0, cfg.holdDurationSeconds - held);
      if (chronoEl) {
        const mm = String(Math.floor(remain/60)).padStart(2,'0');
        const ss = String(Math.floor(remain%60)).padStart(2,'0');
        chronoEl.textContent = mm + ':' + ss;
        chronoEl.classList.add('is-on');
      }
      wrap.classList.add('is-goal','is-hot');
      if (boostEl) boostEl.classList.toggle('is-on', boosting);
      wrap.classList.toggle('is-boost', boosting);
      if (held >= cfg.holdDurationSeconds && !isOverdrive) {
        isOverdrive = true;
        triggerGoal();
        setTimeout(()=>{ isOverdrive=false; }, 1000);
      }
    } else {
      aboveStart = 0; held = 0;
      if (chronoEl) chronoEl.classList.remove('is-on');
      if (boostEl) boostEl.classList.remove('is-on');
      wrap.classList.remove('is-goal','is-boost');
      wrap.classList.toggle('is-hot', displayed >= Math.max(60, th - 12));
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

async function pollState() {
  try {
    const r = await fetch(API + '/api/state', { cache: 'no-store' });
    apply(await r.json());
  } catch (e) { /* hors-ligne : on réessaie au prochain tick */ }
}

function connect() {
  if (q.get('poll') === '1') {            // mode distant (ex. Vercel) : polling 1 s, pas de SSE
    pollTimer = setInterval(pollState, 1000);
    pollState();
    return;
  }
  try {
    es = new EventSource(API + '/events');
    es.onmessage = e => { try { apply(JSON.parse(e.data)); } catch (err) {} };
    es.onopen = () => { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } };
    es.onerror = () => { if (!pollTimer) { pollTimer = setInterval(pollState, 1500); pollState(); } };
  } catch (e) {
    pollTimer = setInterval(pollState, 1500);
  }
  /* garde-fou : si le flux se coupe pendant un débat, on re-synchro */
  setInterval(() => { if (mode !== 'idle' && Date.now() - lastMsg > 7000) pollState(); }, 3000);
}

function vote(choice, user) {
  fetch(API + '/api/vote', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ choice, user: user || 'viewer-' + Math.random().toString(36).slice(2, 8) })
  }).catch(() => {});
}

/* ═══════════════════════════════════════════════════════════════
   MODE DÉMO — simulation autonome (aucun serveur requis)
   ═══════════════════════════════════════════════════════════════ */
const DEMO_DEBATES = [
  { q: 'Le format court a-t-il tué la culture générale ?', a: "Oui, la profondeur s'accélère", b: "Non, l'accès s'élargit", t: 40 },
  { q: 'Un débat sans conclusion est-il vain ?', a: 'Oui, tout doit trancher', b: "Non, l'essentiel est de confronter", t: 36 },
  { q: 'Le live est-il devenu un média d\u2019opinion ?', a: 'Oui, il oriente les foules', b: 'Non, il fait exister les voix', t: 42 }
];
let demoIdx = 0, demoVotes = null, demoTimer = null, demoEndTimer = null;

function demoStart() {
  const d = DEMO_DEBATES[demoIdx % DEMO_DEBATES.length]; demoIdx++;
  demoVotes = { A: 0, B: 0, C: 0, D: 0, bias: Math.random() < .5 ? 1.07 : .93 };
  const d0 = Date.now();
  const hasCD = !!(d.c || d.d);
  setState({ mode: 'live', question: d.q, a: d.a, b: d.b, c: d.c, d: d.d, va: 0, vb: 0, vc: 0, vd: 0,
             startsAt: d0, endsAt: d0 + d.t * 1000, source: 'demo' });
  demoTimer = setInterval(() => {
    if (!demoVotes || !cur) return;
    let n = Math.random() < .6 ? 1 + (Math.random() * 3 | 0) : 0;
    while (n--) {
      const r=Math.random();
      if (hasCD) {
        if (r<0.3) demoVotes.A++; else if (r<0.6) demoVotes.B++; else if (r<0.8) demoVotes.C++; else demoVotes.D++;
      } else {
        (Math.random() < demoVotes.bias ? demoVotes.A++ : demoVotes.B++);
      }
    }
    setState({ mode: 'live', question: cur.question, a: cur.a, b: cur.b, c: cur.c, d: cur.d,
               startsAt: cur.startsAt, va: demoVotes.A, vb: demoVotes.B, vc: demoVotes.C, vd: demoVotes.D, endsAt: cur.endsAt, source: 'demo' });
  }, 520);
  demoEndTimer = setTimeout(demoEnd, d.t * 1000);
}
function demoEnd() {
  if (!cur) return;
  clearInterval(demoTimer);
  const scores=[{k:'A',v:demoVotes.A},{k:'B',v:demoVotes.B},{k:'C',v:demoVotes.C},{k:'D',v:demoVotes.D}].filter(s=>cur[s.k.toLowerCase()]||s.k==='A'||s.k==='B');
  scores.sort((a,b)=>b.v-a.v);
  const w = scores[0]?.k || 'A';
  setState({ mode: 'ended', question: cur.question, a: cur.a, b: cur.b, c: cur.c, d: cur.d,
             startsAt: cur.startsAt, va: demoVotes.A, vb: demoVotes.B, vc: demoVotes.C, vd: demoVotes.D, endsAt: Date.now(), winner: w, source: 'demo' });
  demoVotes = null;
  if (LOOP) setTimeout(demoStart, 9000);
}

/* — Vote par clic (aperçu uniquement) — */
function clickVote(choice) {
  if (mode !== 'live') return;
  if (DEMO && demoVotes) {
    demoVotes[choice]++;
    setState({ mode: 'live', question: cur.question, a: cur.a, b: cur.b, c: cur.c, d: cur.d,
               startsAt: cur.startsAt, va: demoVotes.A, vb: demoVotes.B, vc: demoVotes.C, vd: demoVotes.D, endsAt: cur.endsAt, source: 'demo' });
  } else vote(choice);
}
E.optA.addEventListener('click', () => clickVote('A'));
E.optB.addEventListener('click', () => clickVote('B'));
if (E.optC) E.optC.addEventListener('click', () => clickVote('C'));

  connect();
  fetch('api/goal').then(r => r.json()).then(setGoal).catch(() => {});
  fetch('api/config').then(r => r.json()).then(d => { if (d && d.config) applyConfig(d.config); }).catch(() => {});
}
})();
