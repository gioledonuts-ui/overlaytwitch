<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Widget — Dernier follower</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    #ovt .ovt-card { padding: 0.7rem 1.2rem; gap: 0.8rem; }
  </style>
</head>
<body>
  <div id="ovt"></div>

  <script src="../assets/ovt.js"></script>
  <script>
  (function () {
    OVT.echelle();
    var root = document.getElementById('ovt');
    var dernierNom = null;

    /* Règle d'or : aucun follower connu → on n'affiche RIEN. */
    function affiche(nom, idUtilisateur) {
      if (!nom) { OVT.off(root); return; }

      root.textContent = '';
      var carte = document.createElement('div');
      carte.className = 'ovt-card';

      var img = null;
      if (idUtilisateur) {
        img = document.createElement('img');
        img.className = 'ovt-avatar';
        img.alt = '';
        img.src = ''; /* chargé dès que connu */
        carte.appendChild(img);
        OVT.userById(idUtilisateur).then(function (u) {
          if (u && u.profile_image_url) img.src = u.profile_image_url;
        }).catch(function () {});
      }

      var zone = document.createElement('div');
      var lab = document.createElement('div');
      lab.className = 'ovt-label';
      lab.textContent = 'Dernier follow';
      var val = document.createElement('div');
      val.className = 'ovt-value';
      val.textContent = nom;
      zone.appendChild(lab);
      zone.appendChild(val);
      carte.appendChild(zone);

      root.appendChild(carte);
      OVT.on(root);

      if (nom !== dernierNom) {
        root.classList.remove('pulse'); void root.offsetWidth; root.classList.add('pulse');
        dernierNom = nom;
      }
    }

    /* ---------- mode démo ---------- */
    function demo() {
      OVT.demoBadge();
      affiche('ViewerExemple', null);
      var noms = ['NouveauFollower', 'UneAutreViewer', 'FanNumero1'];
      var i = 0;
      setInterval(function () { i = (i + 1) % noms.length; affiche(noms[i], null); }, 4000);
    }
    if (OVT.DEMO) return demo();

    /* ---------- production ---------- */
    (async function () {
      var r = OVT.reglages();
      if (!r.token) {
        if (OVT.DEBUG) OVT.debugBadge('token manquant');
        OVT.autoRecharge(); /* se connecte tout seul quand le dock se connecte */
        return;
      }
      var moi = await OVT.me();
      var c = await OVT.canal();
      if (OVT.DEBUG) OVT.debugBadge('connecté : ' + moi.login + ' · chaîne : ' + c.login);

      /* état initial : dernier follower actuel */
      try {
        var j = await OVT.helix('/channels/followers?broadcaster_id=' + encodeURIComponent(c.id) + '&first=1');
        var d = (j.data || [])[0];
        if (d && d.user_name) affiche(d.user_name, d.user_id);
      } catch (e) { if (OVT.DEBUG) OVT.debugBadge('followers : ' + e.message); }

      /* temps réel : chaque nouveau follow */
      OVT.eventsub(
        [{ type: 'channel.follow', version: '2',
           condition: { broadcaster_user_id: c.id, moderator_user_id: moi.id } }],
        {
          onEvent: function (ev, type) { affiche(ev.user_name || ev.user_login, ev.user_id); },
          onStatus: OVT.DEBUG ? function (s, info) {
            OVT.debugBadge('temps réel : ' + s + (info ? ' — ' + info : ''));
          } : undefined
        }
      );
    })().catch(function (e) {
      if (OVT.DEBUG) OVT.debugBadge('❌ ' + e.message);
      console.warn('dernier follower :', e.message);
    });
  })();
  </script>
</body>
</html>
